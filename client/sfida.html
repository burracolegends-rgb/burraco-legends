<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Burraco Legends — Partita random</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2a1e12">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  /* ============================================================
     SFIDA UNO SCONOSCIUTO
     Stessa lingua visiva di sala.html (stesso sfondo, stessi colori,
     stesso "riquadro"), ma una strada sola: non c'è nessun codice da
     passare a nessuno. Ci si siede, e a sedersi per secondo è chiunque
     arrivi qui in quel momento — lo decide il server (vedi siediti() in
     server/stanze.js), non un messaggio scambiato fra amici.
     ============================================================ */
  :root {
    --oro: #e8c46a; --oro-chiaro: #fff0c2; --oro-scuro: #9a6f21;
    --pergamena: #f2e6cc; --tenue: #b7a686; --notte: #0b0810;
    --verde: #58c48a; --rosso: #f0736b;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif; color: var(--pergamena);
    background:
      radial-gradient(ellipse at 50% 0%, rgba(42,29,61,0.65) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 100%, rgba(58,36,16,0.6) 0%, transparent 55%),
      url('immagini/decorazioni/sfondo-tavolo.webp') center / cover no-repeat,
      var(--notte);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px; padding: max(20px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
    min-height: 100vh; user-select: none;
  }

  .insegna { text-align: center; }
  .insegna h1 {
    margin: 0; font-family: Georgia, serif; font-size: clamp(1.6rem, 5vw, 2.5rem);
    letter-spacing: 3px; font-weight: 700;
    background: linear-gradient(180deg, #fff6d8, var(--oro) 45%, var(--oro-scuro) 75%, #ffe9ae);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 0 rgba(0,0,0,0.7));
  }
  .insegna .sotto { font-size: 0.85rem; color: var(--tenue); margin-top: 6px; letter-spacing: 0.6px; }

  .riquadro {
    width: min(430px, 100%); border-radius: 16px; padding: 20px;
    border: 1px solid var(--oro-scuro);
    background: linear-gradient(168deg, rgba(52,38,22,0.92), rgba(22,15,9,0.95));
    box-shadow: inset 0 1px 0 rgba(255,224,160,0.18), 0 8px 26px rgba(0,0,0,0.6);
    display: flex; flex-direction: column; gap: 13px;
  }
  .riquadro h2 {
    margin: 0; font-family: Georgia, serif; font-size: 1rem;
    letter-spacing: 2.2px; text-transform: uppercase; color: var(--oro);
  }
  .riquadro p { margin: 0; font-size: 0.83rem; color: var(--tenue); line-height: 1.55; }

  button {
    padding: 13px; border-radius: 11px; border: none; cursor: pointer; font-family: inherit;
    font-size: 0.96rem; font-weight: 800; letter-spacing: 0.7px;
    background: linear-gradient(180deg, #fff0c2, var(--oro) 55%, #b98d2c); color: #2a1c08;
    box-shadow: 0 5px 16px rgba(0,0,0,0.5); transition: transform 0.14s, opacity 0.14s;
  }
  button:hover:not(:disabled) { transform: translateY(-2px); }
  button:disabled { opacity: 0.45; cursor: default; transform: none; }
  button.tenue {
    background: rgba(255,255,255,0.07); color: var(--pergamena);
    border: 1px solid var(--oro-scuro); box-shadow: none;
  }

  /* ---------- l'attesa: qui non c'è nessun codice da mostrare, solo
     un tavolo con un posto vuoto che qualcun altro sta per occupare ---------- */
  .tavolo-vuoto {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 22px 18px; border-radius: 14px; border: 1px dashed var(--oro);
    background: rgba(232,196,106,0.07);
  }
  .posti { display: flex; align-items: center; gap: 14px; }
  .posto {
    width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-size: 1.5rem; border: 2px solid var(--oro-scuro);
    background: rgba(0,0,0,0.35);
  }
  .posto.mio { border-color: var(--oro); color: var(--oro-chiaro); }
  .posto.vuoto { border-style: dashed; color: var(--tenue); animation: postoVuoto 1.6s ease-in-out infinite; }
  @keyframes postoVuoto { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
  .posti .piu { font-size: 1.3rem; color: var(--tenue); }
  .conta-posti { font-size: 0.78rem; letter-spacing: 1.5px; color: var(--tenue); text-transform: uppercase; }
  .nome-mio { font-family: Georgia, serif; font-size: 1.1rem; color: var(--oro-chiaro); }

  .attesa { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: var(--tenue); }
  .puntini { display: inline-flex; gap: 4px; }
  .puntini i {
    width: 7px; height: 7px; border-radius: 50%; background: var(--oro);
    animation: respira 1.3s ease-in-out infinite;
  }
  .puntini i:nth-child(2) { animation-delay: 0.18s; }
  .puntini i:nth-child(3) { animation-delay: 0.36s; }
  @keyframes respira { 0%, 100% { opacity: 0.25; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.1); } }

  .avviso {
    font-size: 0.82rem; padding: 10px 13px; border-radius: 10px; line-height: 1.5;
    border: 1px solid rgba(240,115,107,0.5); background: rgba(90,30,26,0.35); color: #ffc9c4;
  }
  .avviso.buono { border-color: rgba(88,196,138,0.5); background: rgba(30,66,48,0.4); color: #b6ffd4; }
  .nascosto { display: none !important; }

  .torna { position: fixed; top: 16px; left: 16px; font-size: 1.275rem; color: var(--tenue); text-decoration: none; display: inline-flex; align-items: center; gap: 10px; }
  .torna .icona-torna { width: 60px; height: 60px; object-fit: contain; }
  .torna:hover { color: var(--oro); }
  .piede { font-size: 0.7rem; color: #8a7e68; text-align: center; max-width: 420px; line-height: 1.6; }
  .spia-mazzo { margin: 0 0 14px; font-size: 0.85rem; color: #a396c0; text-align: center; line-height: 1.5; }
  .spia-mazzo b { color: #e8c46a; }
  .spia-mazzo a { color: #e8c46a; }
</style>
</head>
<body>

<a class="torna" href="home.html"><img src="immagini/decorazioni/torna-home.webp" alt="" class="icona-torna">Home</a>

<div class="insegna">
  <h1>SFIDA UNO SCONOSCIUTO</h1>
  <p class="spia-mazzo" id="spiaMazzo"></p>
  <div class="sotto">Il server ti abbina a chi sta cercando come te, in questo momento</div>
</div>

<!-- ---------- scelta ---------- -->
<div id="scelta" class="riquadro">
  <h2>Siediti al tavolo</h2>
  <button id="cerca">Trova un avversario</button>
  <p>Ti sediamo al primo tavolo libero. Se non c'è nessuno, il tavolo lo apri tu — e aspetti il prossimo che arriva.</p>
</div>

<!-- ---------- in attesa di uno sconosciuto ---------- -->
<div id="attesa" class="riquadro nascosto">
  <h2>Sei seduto al tavolo</h2>
  <div class="tavolo-vuoto">
    <div class="posti">
      <div class="posto mio">🙂</div>
      <span class="piu">+</span>
      <div class="posto vuoto">?</div>
    </div>
    <span class="nome-mio">Tu</span>
    <span class="conta-posti">1 / 2 seduti</span>
  </div>
  <div class="attesa">
    <span class="puntini"><i></i><i></i><i></i></span>
    <span id="chi-manca">In cerca di un avversario…</span>
  </div>
  <button id="annulla" class="tenue">Lascia il tavolo</button>
</div>

<div id="avviso" class="avviso nascosto"></div>

<div class="piede" id="piede"></div>

<script>
(function () {
"use strict";
const $ = (id) => document.getElementById(id);

let mio = null;          // { codice, giocatore, segreto }
let fermo = false;

function dice(testo, buono) {
  const a = $('avviso');
  a.textContent = testo;
  a.className = 'avviso' + (buono ? ' buono' : '');
}
function zitto() { $('avviso').className = 'avviso nascosto'; }

async function chiedi(via, corpo) {
  const risposta = await fetch(via, corpo ? {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo)
  } : undefined);
  return risposta.json();
}

// Stessa logica di sala.html, parola per parola: il mazzo si legge da
// dove lo lascia selezione.html, il gettone identifica di chi sono le
// carte che si stanno per giocare.
function mazzoDaPortare() {
  try {
    const salvato = JSON.parse(localStorage.getItem('bb_mazzo') || 'null');
    if (salvato && salvato.personaggi && Array.isArray(salvato.carteMagiche)) return salvato;
  } catch (e) {}
  return undefined;
}
function gettoneDaPortare() {
  try { return localStorage.getItem('bb_gettone') || undefined; } catch (e) { return undefined; }
}

(function diCheMazzoSiGioca() {
  const spia = $('spiaMazzo');
  if (!spia) return;
  const mazzo = mazzoDaPortare();
  spia.innerHTML = mazzo
    ? 'Giocherai con <b>il tuo mazzo</b>. <a href="selezione.html">Cambialo</a>'
    : 'Non hai ancora scelto un mazzo: giocherai con la squadra predefinita. <a href="selezione.html">Scegli il tuo</a>';
})();

// ------------------------------------------------------------
// SEDERSI
// ------------------------------------------------------------
$('cerca').addEventListener('click', async () => {
  zitto();
  $('cerca').disabled = true;
  try {
    const r = await chiedi('/api/siediti', { mazzo: mazzoDaPortare(), gettone: gettoneDaPortare() });
    if (!r.ok) { dice(r.motivo || 'Non è stato possibile sedersi al tavolo.'); $('cerca').disabled = false; return; }
    mio = r;
    fermo = false;
    $('scelta').classList.add('nascosto');
    $('attesa').classList.remove('nascosto');
    if (r.giocatore === 1) {
      // il tavolo c'era già: si è il secondo, quindi si va SUBITO,
      // niente attesa da mostrare
      vaiAlTavolo();
      return;
    }
    aspettaLoSconosciuto();
  } catch (e) {
    dice('Il server non risponde. È acceso?');
    $('cerca').disabled = false;
  }
});

$('annulla').addEventListener('click', () => {
  fermo = true;
  mio = null;
  $('attesa').classList.add('nascosto');
  $('scelta').classList.remove('nascosto');
  $('cerca').disabled = false;
  zitto();
});

// ------------------------------------------------------------
// L'ATTESA
// Identica, riga per riga, a quella di sala.html: una domanda sola,
// tenuta appesa dal server finché non si siede qualcuno. La differenza
// non è nel come si aspetta — è in CHI ha aperto il tavolo che si sta
// aspettando, e quello lo decide già il server in siediti().
// ------------------------------------------------------------
async function aspettaLoSconosciuto() {
  let versione = -1;
  while (!fermo && mio) {
    let r;
    try {
      r = await chiedi('/api/stato?codice=' + encodeURIComponent(mio.codice) +
                       '&segreto=' + encodeURIComponent(mio.segreto) +
                       '&da=' + versione);
    } catch (e) {
      dice('Collegamento perso. Riprovo…');
      await new Promise((ok) => setTimeout(ok, 2000));
      continue;
    }
    if (!r.ok) { dice(r.motivo || 'Il tavolo non c\'è più.'); return; }
    zitto();
    versione = r.versione;
    if (!r.inAttesaDelSecondo) {
      const nome = r.nomi[1] || 'Il tuo avversario';
      $('chi-manca').textContent = nome + ' si è seduto. Si comincia…';
      setTimeout(vaiAlTavolo, 700);
      return;
    }
  }
}

function vaiAlTavolo() {
  try {
    localStorage.setItem('bb_tavolo', JSON.stringify({
      codice: mio.codice, segreto: mio.segreto, giocatore: mio.giocatore, quando: Date.now()
    }));
  } catch (e) {}
  location.href = 'tavolo.html#' + new URLSearchParams({
    codice: mio.codice, segreto: mio.segreto, giocatore: String(mio.giocatore)
  }).toString();
}

if (location.protocol === 'file:') {
  dice('Questa pagina va aperta dal server, non con un doppio clic. Avvia "node server/server.js" e vai su http://localhost:8080');
  $('cerca').disabled = true;
} else {
  $('piede').textContent = 'Non sai contro chi giocherai finché non ti siedi: è la sorpresa di un tavolo vero.';
}

window.__prova = { stato: () => mio };
})();
</script>
</body>
</html>
