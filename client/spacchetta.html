<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Burraco Legends — Apri il pacchetto</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2a1e12">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  /* ============================================================
     APERTURA DEI PACCHETTI
     È il momento più emozionante del gioco: il pacchetto si strappa,
     le carte escono una alla volta e si girano, e più la carta è rara
     più la messinscena cresce. Tutto disegnato in CSS e SVG.
     ============================================================ */
  :root {
    --oro: #e8c46a; --oro-chiaro: #fff0c2; --oro-scuro: #9a6f21;
    --pergamena: #f2e6cc; --tenue: #b7a686; --notte: #0b0810;
    /* un colore per ogni grado di rarità: più stelle, più acceso */
    --r1: #8d93a3; --r2: #63c27e; --r3: #4aa3f0; --r4: #b070f5; --r5: #ffb347;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif; color: var(--pergamena);
    background:
      radial-gradient(ellipse at 50% 42%, rgba(36,26,53,0.72) 0%, rgba(18,13,28,0.85) 55%, rgba(10,7,15,0.92) 100%),
      url('immagini/decorazioni/sfondo-tavolo.webp') center / cover no-repeat;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    user-select: none;
  }

  /* stelle di fondo */
  .stelle { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .stella { position: absolute; border-radius: 50%; background: #fff; animation: brilla ease-in-out infinite; }
  @keyframes brilla { 0%,100% { opacity: 0.12; } 50% { opacity: 0.6; } }

  /* raggi che ruotano, si accendono solo per le carte rare */
  .raggi {
    position: fixed; width: 200vmax; height: 200vmax; z-index: 1; pointer-events: none;
    left: 50%; top: 50%; margin-left: -100vmax; margin-top: -100vmax;
    background: repeating-conic-gradient(from 0deg, rgba(255,255,255,0.14) 0deg 4deg, transparent 4deg 13deg);
    animation: gira 24s linear infinite; opacity: 0; transition: opacity 0.6s;
  }
  @keyframes gira { to { transform: rotate(360deg); } }

  .schermo { position: relative; z-index: 3; display: flex; flex-direction: column; align-items: center; gap: 2.4vh; width: 100%; }

  /* ---------- 1. IL PACCHETTO CHIUSO ---------- */
  .pacchetto {
    position: relative; width: min(30vh, 74vw); cursor: pointer;
    animation: ondeggia 3.4s ease-in-out infinite;
  }
  .pacchetto:hover { animation-play-state: paused; }
  .pacchetto .arte-pacchetto { width: 100%; display: block; border-radius: 4%; user-select: none; }
  .pacchetto .linee-strappo { position: absolute; inset: 0; width: 100%; height: 100%; }
  @keyframes ondeggia {
    0%,100% { transform: translateY(0) rotate(-1.4deg); }
    50%     { transform: translateY(-1.6vh) rotate(1.4deg); }
  }
  /* ---------- LO STRAPPO DELL'INVOLUCRO ----------
     L'involucro è disegnato DUE VOLTE, uno sopra l'altro, e ogni copia
     è ritagliata lungo la dentellatura con clip-path: sopra resta solo
     la linguetta, sotto solo il corpo. Sono due <div> normali, non
     gruppi SVG: prima le animazioni erano su <g> con clip-path e il
     browser non le mostrava, per questo si vedeva solo lo scuotimento.
     Ora lo strappo si apre lento, poi la linguetta vola e il corpo cade. */
  .meta {
    position: absolute; inset: 0; transform-origin: 50% 18%;
    filter: drop-shadow(0 2vh 3vh rgba(0,0,0,0.7));
  }
  .meta-alta  { clip-path: polygon(0% 0%, 100% 0%, 100.000% 17.857%, 93.000% 20.357%, 85.000% 17.857%, 77.000% 20.357%, 69.000% 17.857%, 61.000% 20.357%, 53.000% 17.857%, 45.000% 20.357%, 37.000% 17.857%, 29.000% 20.357%, 21.000% 17.857%, 13.000% 20.357%, 5.000% 17.857%, 0.000% 17.857%); z-index: 2; }
  .meta-bassa { clip-path: polygon(0.000% 17.857%, 5.000% 17.857%, 13.000% 20.357%, 21.000% 17.857%, 29.000% 20.357%, 37.000% 17.857%, 45.000% 20.357%, 53.000% 17.857%, 61.000% 20.357%, 69.000% 17.857%, 77.000% 20.357%, 85.000% 17.857%, 93.000% 20.357%, 100.000% 17.857%, 100% 100%, 0% 100%); z-index: 1; }
  /* una copia invisibile tiene l'altezza del contenitore */
  .meta-misura { position: relative; visibility: hidden; }
  /* la perforazione sparisce nel momento in cui si strappa e al suo
     posto resta l'orlo lacerato, pieno */
  .pacchetto.strappato .dentellatura { opacity: 0; }
  .pacchetto.strappato .orlo { opacity: 0.9; }

  .pacchetto.strappato { animation: none; }
  .pacchetto.strappato .meta-alta  { animation: linguettaVia 1.05s ease-in both; }
  .pacchetto.strappato .meta-bassa { animation: corpoGiu    1.05s ease-in both; }

  /* Erano due pezzi che "esplodevano" in direzioni quasi opposte, ognuno
     ruotando E traslando E (il corpo) rimpicciolendo insieme: troppe
     cose diverse in una volta, e con un'immagine fotorealistica sopra
     (prima era un disegno piatto) si vedeva ancora di piu' quanto fosse
     posticcio — segnalato esplicitamente: "anche l'animazione dello
     strappo è pessima". Rifatta sul gesto vero: si strappa una
     linguetta, non si fa scoppiare un pacchetto. transform-origin resta
     al 18% (la linea dello strappo, vedi .meta) — e' proprio la
     cerniera su cui la linguetta ruota all'indietro, come un coperchio.
     Il corpo non ruota quasi per niente e non rimpicciolisce: scivola
     dritto verso il basso, come ci si aspetta scompaia sotto al tavolo. */
  @keyframes linguettaVia {
    0%   { transform: translate(0,0) rotate(0deg); opacity: 1; }
    20%  { transform: translate(-0.5%, -2%) rotate(-6deg); opacity: 1; }
    50%  { transform: translate(1%, -10%) rotate(-32deg); opacity: 1; }
    100% { transform: translate(10%, -46%) rotate(-96deg); opacity: 0; }
  }
  @keyframes corpoGiu {
    0%   { transform: translate(0,0) rotate(0deg); opacity: 1; }
    35%  { transform: translate(0, 3%) rotate(0.5deg); opacity: 1; }
    100% { transform: translate(0, 52%) rotate(2deg); opacity: 0; }
  }
  /* bagliore che esce dallo squarcio mentre le due metà si separano */
  .squarcio {
    position: absolute; left: 4%; right: 4%; top: 17.4%; height: 3%;
    border-radius: 50%; pointer-events: none; opacity: 0; z-index: 3;
    background: radial-gradient(ellipse, #ffffff 0%, #fff6d0 30%, #ffd97a 55%, transparent 78%);
  }
  .pacchetto.strappato .squarcio { animation: squarcioLuce 1s ease-out both; }
  @keyframes squarcioLuce {
    0%   { opacity: 0;    transform: scaleY(0.2) scaleX(0.5); }
    30%  { opacity: 0.85; transform: scaleY(2.2) scaleX(1); }
    50%  { opacity: 1;    transform: scaleY(6)   scaleX(1.15); }
    100% { opacity: 0;    transform: scaleY(16)  scaleX(1.35); }
  }

  .invito { font-size: 1.05rem; letter-spacing: 2.4px; text-transform: uppercase; color: var(--oro);
            animation: pulsaInvito 1.9s ease-in-out infinite; }
  @keyframes pulsaInvito { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
  .quante-dentro { font-size: 1.15rem; color: var(--pergamena); letter-spacing: 1px; }
  .quante-dentro b { color: var(--oro-chiaro); font-size: 1.5rem; }
  .costo-pacchetto {
    display: flex; align-items: center; gap: 6px; font-size: 1rem;
    color: var(--oro); font-variant-numeric: tabular-nums;
  }

  /* il borsellino, sempre in vista in alto a destra */
  .borsellino {
    position: fixed; top: 2vh; right: 2vh; z-index: 9;
    display: flex; align-items: center; gap: 7px; padding: 6px 13px 6px 7px;
    border-radius: 999px; border: 1px solid var(--oro-scuro);
    background: linear-gradient(168deg, rgba(74,53,32,0.92), rgba(24,17,10,0.95));
    box-shadow: 0 3px 12px rgba(0,0,0,0.6);
  }
  .borsellino .cifra { font-size: 0.98rem; font-weight: 800; color: var(--oro-chiaro); font-variant-numeric: tabular-nums; }
  .borsellino .etichetta-moneta {
    font-size: 0.58rem; letter-spacing: 1px; text-transform: uppercase;
    color: var(--tenue); font-weight: 600;
  }
  .borsellino .cifra.scesa { animation: saldoScende 0.8s ease-out; }
  @keyframes saldoScende {
    0%   { transform: scale(1.18); color: #ffb0a8; }
    100% { transform: scale(1); color: var(--oro-chiaro); }
  }

  /* quando gli sharkini non bastano */
  .niente-soldi {
    display: flex; flex-direction: column; align-items: center; gap: 1.8vh;
    text-align: center; max-width: 34rem; padding: 0 1.5rem;
  }
  .niente-soldi .lucchetto { opacity: 0.85; filter: grayscale(0.55); }
  .niente-soldi h2 { margin: 0; font-family: Georgia, serif; font-size: 2.7vh; color: var(--oro-chiaro); }
  .niente-soldi p { margin: 0; font-size: 1.6vh; color: var(--tenue); line-height: 1.6; }
  .niente-soldi .consiglio { color: #b6ffd4; }
  .niente-soldi .consiglio b { color: #d9ffe9; }
  .niente-soldi .bottoni { display: flex; gap: 1.2vh; flex-wrap: wrap; justify-content: center; margin-top: 1vh; }
  .contatore-pity { font-size: 0.78rem; color: var(--tenue); }
  .contatore-pity b { color: var(--oro); }

  /* ---------- 2. LA CARTA CHE SI GIRA ---------- */
  /* Il palco resta a zero finché non arrivano le carte: se tiene i suoi
     62vh anche a pacchetto chiuso, spinge il pacchetto in cima allo
     schermo e non è più centrato. */
  .palco { position: relative; width: 100%; display: flex; align-items: center; justify-content: center; min-height: 0; }
  .palco.attivo { min-height: 62vh; }
  .scena-carta { perspective: 1400px; display: none; }
  .scena-carta.viva { display: block; }

  .carta3d {
    position: relative; width: calc(52vh * 0.7); height: 52vh; max-width: 86vw;
    transform-style: preserve-3d; cursor: pointer;
    animation: cartaArriva 0.55s cubic-bezier(.2,.9,.3,1) both;
  }
  @keyframes cartaArriva {
    0%   { transform: translateY(34vh) scale(0.4) rotateZ(-14deg); opacity: 0; }
    70%  { transform: translateY(-1.6vh) scale(1.05) rotateZ(2deg); opacity: 1; }
    100% { transform: translateY(0) scale(1) rotateZ(0); opacity: 1; }
  }
  .carta3d.girata .faccia-interna { transform: rotateY(180deg); }
  .faccia-interna {
    position: relative; width: 100%; height: 100%; transform-style: preserve-3d;
    transition: transform 0.72s cubic-bezier(.4,.1,.2,1);
  }
  .faccia {
    position: absolute; inset: 0; backface-visibility: hidden; border-radius: 2.2vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden; box-sizing: border-box;
  }

  /* dorso */
  .dorso {
    border: 0.45vh solid var(--oro-scuro);
    background:
      repeating-linear-gradient(45deg, #2c2140 0 1.2vh, #241a35 1.2vh 2.4vh),
      #241a35;
    box-shadow: inset 0 0 6vh rgba(0,0,0,0.75);
  }
  .dorso .marchio { width: 40%; opacity: 0.9; }

  /* fronte */
  /* Il fronte non si disegna piu' da se': lo riempie la carta
     illustrata. Niente padding ne' sfondo — coprirebbero la cornice —
     ma l'alone per rarita' resta, ed e' quello che fa capire di che
     livello e' la carta appena girata prima ancora di leggerla. */
  .fronte {
    transform: rotateY(180deg); padding: 0;
    box-shadow: 0 0 6vh var(--alone, transparent);
  }
  /* NUOVA / DOPPIONE: sta SOPRA la carta, come una fascetta appiccicata.
     Lo z-index serve: la cornice e' un'immagine dentro la carta, e senza
     ordine dichiarato la fascetta ci finirebbe sotto. */
  .fronte .etichetta {
    position: absolute; top: 1.4vh; left: 50%; transform: translateX(-50%); z-index: 4;
    font-size: 1.35vh; font-weight: 900; letter-spacing: 0.25vh; text-transform: uppercase;
    padding: 0.5vh 1.6vh; border-radius: 2vh; white-space: nowrap;
  }
  .mini .tag { z-index: 4; }
  .etichetta.nuova { background: linear-gradient(180deg, #9dffc4, #35c46f); color: #05301a; box-shadow: 0 0 2.4vh rgba(53,196,111,0.85); }
  .etichetta.doppia { background: rgba(0,0,0,0.55); color: var(--tenue); border: 1px solid rgba(255,255,255,0.22); }

  /* alone dietro la carta, tanto più forte quanto è rara */
  .aura {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 84vh; height: 84vh; border-radius: 50%; pointer-events: none; z-index: -1;
    background: radial-gradient(circle, var(--alone, transparent) 0%, transparent 62%);
    opacity: 0; transition: opacity 0.5s;
  }
  .aura.accesa { opacity: 1; animation: respiroAura 2.6s ease-in-out infinite; }
  @keyframes respiroAura { 0%,100% { transform: translate(-50%,-50%) scale(1); } 50% { transform: translate(-50%,-50%) scale(1.09); } }

  /* ---------- coriandoli e scintille ---------- */
  .particella {
    position: fixed; z-index: 6; pointer-events: none; border-radius: 50%;
    animation: schizza cubic-bezier(.15,.7,.4,1) forwards;
  }
  @keyframes schizza {
    0%   { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.2); }
  }
  .coriandolo {
    position: fixed; z-index: 6; pointer-events: none; width: 0.9vh; height: 1.6vh; border-radius: 1px;
    animation: cade linear forwards;
  }
  @keyframes cade {
    0%   { opacity: 1; transform: translate(-50%,-50%) rotate(0); }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), 92vh) rotate(var(--giro)); }
  }

  /* ---------- barra di avanzamento delle carte ---------- */
  .segnaposti { display: flex; gap: 1vh; }
  .segnaposto {
    width: 1.5vh; height: 1.5vh; border-radius: 50%; background: rgba(255,255,255,0.16);
    border: 1px solid rgba(255,255,255,0.25); transition: background 0.3s, transform 0.3s;
  }
  .segnaposto.fatto { background: var(--oro); box-shadow: 0 0 1.4vh var(--oro); }
  .segnaposto.corrente { transform: scale(1.5); background: var(--oro-chiaro); box-shadow: 0 0 2vh var(--oro-chiaro); }

  .suggerimento { font-size: 0.86rem; color: var(--tenue); letter-spacing: 1.4px; min-height: 1.3em; }

  /* SALTA LO SPETTACOLO. Un pacchetto grande (50 carte) vuol dire 50
     tocchi uno per uno per chi non ha voglia di aspettare stavolta: il
     riepilogo con tutte le figurine c'è comunque, si può arrivarci
     subito invece di passarci in mezzo per forza. Visibile solo mentre
     le carte si stanno ancora rivelando — sul riepilogo non c'è più
     niente da saltare. */
  .salta-apertura {
    position: fixed; bottom: 2vh; right: 2vh; z-index: 9; display: none;
    padding: 7px 16px; border-radius: 999px; cursor: pointer;
    font-family: inherit; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.5px;
    color: var(--tenue); border: 1px solid rgba(232,196,106,0.35);
    background: rgba(20,15,9,0.72); backdrop-filter: blur(3px);
    transition: color 0.15s, border-color 0.15s;
  }
  .salta-apertura:hover, .salta-apertura:active { color: var(--oro-chiaro); border-color: var(--oro); }
  .salta-apertura.mostra { display: block; }

  /* ---------- 3. RIEPILOGO ---------- */
  .riepilogo { display: none; flex-direction: column; align-items: center; gap: 2vh; animation: entraRiep 0.5s ease-out; }
  .riepilogo.viva { display: flex; }
  @keyframes entraRiep { from { opacity: 0; transform: translateY(2.4vh); } to { opacity: 1; } }
  .riepilogo h2 { margin: 0; font-family: Georgia, serif; font-size: 3.4vh; color: var(--oro-chiaro); letter-spacing: 0.3vh; }
  .griglia { display: flex; gap: 1.4vh; flex-wrap: wrap; justify-content: center; }
  /* La figurina del riepilogo e' il portafoto: dentro c'e' la carta
     illustrata, qui restano solo l'alone per rarita' e il bollino. */
  .mini {
    width: 13vh; height: 18.5vh; border-radius: 1.2vh; position: relative;
    box-shadow: 0 0 2.4vh var(--alone, transparent);
    animation: miniEntra 0.4s backwards;
  }
  @keyframes miniEntra { from { opacity: 0; transform: translateY(2vh) scale(0.9); } }
  .mini .tag { position: absolute; top: -0.9vh; font-size: 1vh; font-weight: 900; padding: 0.25vh 0.9vh; border-radius: 1vh; letter-spacing: 0.1vh; z-index: 5; left: 50%; transform: translateX(-50%); white-space: nowrap; }
  .mini .tag.nuova { background: #35c46f; color: #05301a; }
  .mini .tag.doppia { background: #3b3550; color: var(--tenue); }
  /* Quante copie della stessa carta sono uscite in QUESTA apertura. */
  .mini .quante {
    position: absolute; bottom: 0.6vh; right: 0.6vh; z-index: 5;
    background: rgba(13,10,19,0.85); color: #fff0c2; border: 1px solid var(--oro-scuro, #9a6f21);
    font-size: 1.1vh; font-weight: 900; padding: 0.2vh 0.7vh; border-radius: 1vh;
  }

  .incasso { font-size: 1rem; color: var(--tenue); }
  .incasso b { color: var(--oro); }

  .bottoni { display: flex; gap: 1.4vh; flex-wrap: wrap; justify-content: center; }
  .bottone {
    padding: 1.4vh 3vh; border-radius: 1.2vh; border: 2px solid var(--oro-scuro); cursor: pointer;
    font-size: 1rem; font-weight: 700; letter-spacing: 0.1vh; text-decoration: none;
    background: linear-gradient(180deg, #4a3520, #2a1c10); color: var(--pergamena);
    box-shadow: inset 0 1px 0 rgba(255,224,160,0.22), 0 0.6vh 1.8vh rgba(0,0,0,0.55);
    transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
  }
  .bottone:hover { transform: translateY(-2px); border-color: var(--oro); box-shadow: 0 1vh 2.4vh rgba(0,0,0,0.6), 0 0 2vh rgba(232,196,106,0.35); }
  .bottone.principale { background: linear-gradient(180deg, var(--oro-chiaro), var(--oro)); color: #1b1208; border-color: var(--oro-chiaro); }

  /* Stessa misura di selezione.html: prima qui era 2.55rem, quasi il
     doppio, senza un motivo — solo disallineamento accumulato. */
  .torna { position: fixed; top: 2vh; left: 2vh; z-index: 8; font-size: 1.275rem; color: var(--tenue); text-decoration: none; display: inline-flex; align-items: center; gap: 10px; }
  .torna .icona-torna { width: 60px; height: 60px; object-fit: contain; }
  .torna:hover { color: var(--oro); }

  /* ---------- LA CARTA ILLUSTRATA (condivisa fra le pagine) ---------- */
  .carta-illustrata {
    position: relative; aspect-ratio: 0.71; overflow: hidden;
    container-type: inline-size;
    /* Lo sfondo si vede DENTRO la finestra, dietro l'illustrazione:
       le illustrazioni hanno lo sfondo trasparente, quindi il colore
       della carta traspare intorno al personaggio ed e' quello che le
       fa sembrare disegnate dentro la cornice invece che incollate. */
    background:
      radial-gradient(ellipse at 50% 30%, var(--velo, rgba(255,255,255,0.10)), transparent 62%),
      linear-gradient(168deg, #2a2140 0%, #1a1428 60%, #120d1c 100%);
    --fin-x: 15.16%; --fin-y: 13.57%; --fin-w: 69.91%; --fin-h: 51.73%;
    --nome-x: 17.36%; --nome-y: 4.52%; --nome-w: 64.24%; --nome-h: 7.81%;
    /* ERA --desc-x:14.47%/--desc-w:70.02% (bordo destro all'84.49%): sulla
       cornice personaggio la targa di pergamena per la descrizione e'
       piu' stretta di cosi', e il testo finiva a scrivere sopra
       l'intaglio dorato a destra — segnalato con uno screenshot da chi
       lo vedeva davvero sul telefono. Restretto e ricentrato sulla
       stessa mezzeria (~49,5%), bordo destro adesso all'81%. */
    --desc-x: 18%; --desc-y: 67.84%; --desc-w: 63%; --desc-h: 10.28%;
    --statsx-x: 14.47%; --statdx-x: 50.93%; --stat-y: 81.83%;
    --statsx-w: 31.25%; --statdx-w: 33.56%; --stat-h: 8.22%;
  }
  /* La cornice delle Carte Magiche ha proporzioni sue: finestra un
     filo piu' bassa e UN SOLO riquadro in basso, piu' alto (niente
     vita/attacco da scrivere, solo l'effetto). */
  .carta-illustrata.magica {
    --fin-y: 13.31%; --fin-h: 52.44%;
    --nome-x: 19.68%; --nome-y: 4.87%; --nome-w: 61.34%; --nome-h: 7.71%;
    --desc-x: 15.63%; --desc-y: 68.18%; --desc-w: 69.44%; --desc-h: 21.10%;
  }

  .ci-finestra {
    position: absolute; overflow: hidden;
    left: var(--fin-x); top: var(--fin-y); width: var(--fin-w); height: var(--fin-h);
  }
  /* "a coprire": l'illustrazione riempie tutta la finestra e quello che
     avanza si taglia, invece di lasciare bordi vuoti ai lati. */
  .ci-arte { width: 100%; height: 100%; object-fit: cover; display: block; }

  .ci-cornice {
    position: absolute; inset: 0; width: 100%; height: 100%;
    display: block; pointer-events: none;
  }

  /* --- i testi, ognuno nel suo spazio vuoto della cornice --- */
  .ci-testata, .ci-desc, .ci-stat {
    position: absolute; display: flex; align-items: center; justify-content: center;
    text-align: center; overflow: hidden; pointer-events: none;
  }
  .ci-testata {
    left: var(--nome-x); top: var(--nome-y); width: var(--nome-w); height: var(--nome-h);
    flex-direction: column; gap: 0;
  }
  .ci-nome {
    font-family: Georgia, 'Times New Roman', serif; font-weight: 700;
    color: #f0e2c0; line-height: 1.05;

  }
  .ci-stelle { color: #e2b43c; line-height: 1; font-size: 7px; font-size: 3.6cqw; }
  .ci-seme { color: #c41e28; font-size: 8px; font-size: 4.6cqw; line-height: 1; }

  /* PIU' GRASSA — segnalato da chi la leggeva sul telefono, anche dopo
     che la carta era gia' stata ingrandita al massimo: un serif sottile
     a corpo piccolo si perde contro l'illustrazione sotto. Il peso 700

  .ci-desc {

    padding: 0 3%;
    font-family: Georgia, 'Times New Roman', serif; font-weight: 700; color: #241a10;

  /* SULLA CORNICE MAGICA il riquadro non e' pergamena ma metallo scuro,
     quindi il testo va chiaro. Era pero' un grigio-lilla tenue su un
     grigio medio: sulla carta si leggeva a fatica, grigio su grigio.
     Adesso e' un bianco caldo pieno, con un'ombra netta sotto che lo
     stacca dal fondo — la stessa che porta il nome nella barra in cima.
     E il corpo cresce un po': quel riquadro e' il doppio piu' alto di
     quello dei personaggi, il testo ci sta comodo. */
  .carta-illustrata.magica .ci-desc {

  /* TUTTE LE CLASSI QUI DENTRO COMINCIANO PER "ci-", e non e' pignoleria:
     questo pezzo viene incollato dentro pagine che hanno un CSS loro, e
     un nome comune si scontra. E' successo davvero: "etichetta" e'
     anche il bollino NUOVA/DOPPIONE dell'apertura pacchetti, che e'
     position:absolute — l'etichetta VITA se lo prendeva e finiva
     sopra al proprio numero. Con il prefisso non puo' piu' capitare. */
  /* VITA / ATT: l'etichetta SOPRA, il numero SOTTO, e devono restare
     due righe separate. Prima l'altezza del riquadro era fissata al
     riquadro della cornice e il contenuto, se cresceva, ci finiva
     dentro a forza: l'etichetta e il numero si accavallavano.
     Adesso l'altezza e' un MINIMO, non una gabbia — il riquadro parte

  /* SULLE CARTE PICCOLE il testo minuto non si legge: si toglie invece

  @container (max-width: 165px) {

  .ci-senza-arte {
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;

  .fronte .carta-illustrata, .mini .carta-illustrata {

<script>
(function () {
"use strict";

const __SHA = (function(){
// ============================================================
// BURRACO LEGENDS — GLI SHARKINI
//
// Nel gioco c'è UNA SOLA moneta: lo sharkino. Le carte si comprano
// solo con gli sharkini, mai direttamente con i soldi. I soldi veri
// servono unicamente a ricaricare sharkini. Due passaggi, non uno:
//
//     euro  →  sharkini  →  pacchetti di carte
//
// Il motivo non è estetico. Gli sharkini si guadagnano anche entrando
// ogni giorno: se le carte avessero un prezzo in euro accanto a quello
// in sharkini, il premio giornaliero diventerebbe un listino, e il
// giocatore che non spende si sentirebbe ricordare ogni volta quanto
// vale il tempo che ha regalato al gioco. Con una moneta sola, chi
// gioca e chi paga arrivano allo stesso posto per strade diverse.
//
// IL PREMIO DI OGNI GIORNO
// Primo giorno 100, poi 100 in più ogni giorno fino a 700 al settimo.
// Da lì in poi resta 700, all'infinito, FINCHÉ non si salta un giorno:
// chi salta ricomincia da 100. Non si perdono gli sharkini già presi,
// si perde la scala.
//
// IL CAMBIO
// Un mese intero di accessi consecutivi = un pacchetto da 5 carte.
// È il paletto deciso col committente e da lì scendono tutti i prezzi.
// Verificato dal test, non a occhio.
//
// NUMERI ANCORA PROVVISORI, da tarare col playtest:
//   - la scala del premio giornaliero
//   - il cambio euro → sharkini
//   - i prezzi dei pacchetti
// ============================================================

// ------------------------------------------------------------
// 1. IL PREMIO GIORNALIERO
// ------------------------------------------------------------
const PREMI_SETTIMANA = [100, 200, 300, 400, 500, 600, 700];
const PREMIO_MASSIMO = PREMI_SETTIMANA[PREMI_SETTIMANA.length - 1];

// Quanto vale il giorno numero N della serie (N parte da 1).
function premioDelGiorno(giorno) {
  if (giorno < 1) return 0;
  return giorno <= PREMI_SETTIMANA.length ? PREMI_SETTIMANA[giorno - 1] : PREMIO_MASSIMO;
}

// Quanto raccoglie in tutto chi entra N giorni di fila senza saltarne uno.
function guadagnoInGiorni(giorni) {
  let somma = 0;
  for (let g = 1; g <= giorni; g++) somma += premioDelGiorno(g);
  return somma;
}

// ------------------------------------------------------------
// LE DATE
// Confronto i giorni di calendario, non i millisecondi: chi entra alle
// 23:50 e poi alle 00:10 ha fatto due giorni, chi entra alle 09:00 e
// alle 21:00 ne ha fatto uno solo. Uso la data locale del giocatore,
// che è quella che lui vede sul telefono.
// ------------------------------------------------------------
function giornoDiCalendario(quando) {
  const d = new Date(quando);
  return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000;
}

const SERIE_NUOVA = { giorno: 0, ultimoRitiro: null, saldo: 0 };

// Che cosa mostrare al giocatore in questo momento, senza cambiare nulla.
function statoSerie(serie, adesso) {
  const oggi = giornoDiCalendario(adesso);
  const ultimo = serie.ultimoRitiro;

  if (ultimo === null) {
    return { puoRitirare: true, giorno: 1, premio: premioDelGiorno(1),
             serieRotta: false, giaRitiratoOggi: false };
  }
  const distanza = oggi - ultimo;

  if (distanza <= 0) {                       // già passato di qui oggi
    return { puoRitirare: false, giorno: serie.giorno, premio: premioDelGiorno(serie.giorno),
             serieRotta: false, giaRitiratoOggi: true };
  }
  if (distanza === 1) {                      // la serie regge
    const g = serie.giorno + 1;
    return { puoRitirare: true, giorno: g, premio: premioDelGiorno(g),
             serieRotta: false, giaRitiratoOggi: false };
  }
  return { puoRitirare: true, giorno: 1, premio: premioDelGiorno(1),   // saltato: si ricomincia
           serieRotta: true, giaRitiratoOggi: false };
}

// Ritira il premio. Restituisce sempre una serie nuova, non tocca quella
// ricevuta: così chi chiama non si ritrova lo stato cambiato sotto i piedi.
function ritiraPremio(serie, adesso) {
  const stato = statoSerie(serie, adesso);
  if (!stato.puoRitirare) return { serie, guadagno: 0, stato };
  const aggiornata = {
    giorno: stato.giorno,
    ultimoRitiro: giornoDiCalendario(adesso),
    saldo: serie.saldo + stato.premio
  };
  return { serie: aggiornata, guadagno: stato.premio, stato };
}

// Quanto manca prima che la serie si rompa, per poterlo dire al
// giocatore prima e non dopo:
//    1  = tutto a posto, il premio di domani è ancora tuo
//    0  = ultimo giorno utile, se non entri oggi la perdi
//   -1  = già persa
// null = non c'è ancora nessuna serie da perdere
function giorniPrimaDiPerdereLaSerie(serie, adesso) {
  if (serie.ultimoRitiro === null) return null;
  const passati = giornoDiCalendario(adesso) - serie.ultimoRitiro;
  return passati >= 2 ? -1 : 1 - passati;
}

// ------------------------------------------------------------
// 2. IL CAMBIO CON GLI EURO
// Ricariche: più grande è la ricarica, più sharkini per euro. Il bonus
// cresce sempre, mai un gradino che rende peggiore la ricarica più cara.
// ------------------------------------------------------------
const SHARKINI_PER_EURO = 6000;

const RICARICHE = [
  { id: 'manciata', euro: 1.00,  bonus: 0    },
  { id: 'sacchetto', euro: 2.00, bonus: 0.05 },
  { id: 'borsa',    euro: 5.00,  bonus: 0.10 },
  { id: 'cassa',    euro: 10.00, bonus: 0.15, etichetta: 'popolare' },
  { id: 'baule',    euro: 20.00, bonus: 0.20 },
  { id: 'montagna', euro: 50.00, bonus: 0.25, etichetta: 'conviene' }
].map((r) => ({
  ...r,
  base: Math.round(r.euro * SHARKINI_PER_EURO),
  extra: Math.round(r.euro * SHARKINI_PER_EURO * r.bonus),
  sharkini: Math.round(r.euro * SHARKINI_PER_EURO * (1 + r.bonus))
}));

function sharkiniPerEuro(ricarica) { return ricarica.sharkini / ricarica.euro; }

// ------------------------------------------------------------
// 3. QUANTO COSTANO I PACCHETTI
// Il paletto: 30 giorni di accessi di fila devono bastare per il
// pacchetto da 5 carte. Tutti gli altri prezzi seguono la stessa curva
// di sconto di prima, così il taglio grande conviene sempre.
// ------------------------------------------------------------
const GIORNI_PER_UN_PACCO = 30;

function saldoPuoPagare(saldo, costo) { return saldo >= costo; }

function spendi(saldo, costo) {
  if (!saldoPuoPagare(saldo, costo)) return { saldo, riuscito: false };
  return { saldo: saldo - costo, riuscito: true };
}

// Quanti giorni di accessi servono per arrivare a una certa cifra,
// partendo da zero e senza saltare mai un giorno.
function giorniPerRaccogliere(costo) {
  let somma = 0, g = 0;
  while (somma < costo) { g++; somma += premioDelGiorno(g); }
  return g;
}

function formattaSharkini(n) {
  return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}

// Il numero da solo non dice niente: "ti mancano 6.000" di che cosa?
// Ovunque ci sia spazio, la cifra va accompagnata dal nome della moneta.
function conNome(n) {
  const q = Math.round(n);
  return formattaSharkini(q) + (q === 1 ? ' sharkino' : ' sharkini');
}

return {PREMI_SETTIMANA, PREMIO_MASSIMO, premioDelGiorno, guadagnoInGiorni, giornoDiCalendario, SERIE_NUOVA, statoSerie, ritiraPremio, giorniPrimaDiPerdereLaSerie, SHARKINI_PER_EURO, RICARICHE, sharkiniPerEuro, GIORNI_PER_UN_PACCO, saldoPuoPagare, spendi, giorniPerRaccogliere, formattaSharkini, conNome};
})();
const {PREMI_SETTIMANA, PREMIO_MASSIMO, premioDelGiorno, guadagnoInGiorni, giornoDiCalendario, SERIE_NUOVA, statoSerie, ritiraPremio, giorniPrimaDiPerdereLaSerie, SHARKINI_PER_EURO, RICARICHE, sharkiniPerEuro, GIORNI_PER_UN_PACCO, saldoPuoPagare, spendi, giorniPerRaccogliere, formattaSharkini, conNome} = __SHA;

const __PAC = (function(){
// ============================================================
// BURRACO LEGENDS — PACCHETTI DI CARTE
//
// Che cosa esce da un pacchetto, e con che probabilità. Sta qui e non
// nella pagina perché è una REGOLA DI GIOCO, non una decorazione: deve
// essere provabile, controllabile e — un domani — eseguibile sul server,
// dove il giocatore non può metterci le mani.
//
// PITY SYSTEM (spec §10)
// Ogni tot pacchetti si ha la garanzia di una carta ★5 e due ★4. Senza
// una garanzia, la sfortuna può accanirsi per decine di pacchetti e il
// giocatore smette. Il contatore va conservato fra una sessione e
// l'altra: qui viene passato dentro e restituito aggiornato.
//
// NUMERI ANCORA PROVVISORI, da tarare col playtest:
//   - soglia del pity
//   - probabilità per rarità
//   - costo in sharkini
// ============================================================

const CARTE_PER_PACCHETTO = 5;   // il taglio "normale"

// ------------------------------------------------------------
// I TAGLI IN VENDITA
//
// I pacchetti si pagano SOLO in sharkini. Qui dentro non compare
// nessun euro, e non è una svista: gli euro comprano sharkini, gli
// sharkini comprano carte (vedi engine/sharkini.js).
//
// Il paletto da cui scende tutto: 30 giorni di accessi consecutivi
// devono bastare per il pacchetto da 5 carte → 18.000 sharkini.
// Gli altri tagli tengono la stessa curva: il costo per carta scende
// sempre salendo di taglio, il pacchetto grande non deve MAI convenire
// meno di quello piccolo. Controllato da un test apposta.
// ------------------------------------------------------------
const OFFERTE = [
  { id: 'busta',    carte: 1,  costo:   6000, etichetta: null },
  { id: 'trio',     carte: 3,  costo:  12000, etichetta: null },
  { id: 'pacco',    carte: 5,  costo:  18000, etichetta: null },
  { id: 'scrigno',  carte: 10, costo:  30000, etichetta: 'popolare' },
  { id: 'forziere', carte: 25, costo:  60000, etichetta: null },
  { id: 'tesoro',   carte: 50, costo: 108000, etichetta: 'conviene' }
];

// ------------------------------------------------------------
// I TAGLI SOLO PER LE CARTE MAGIA — un terzo del prezzo.
//
// Una Carta Magica vale un solo utilizzo, poi sparisce dalla collezione:
// pagarla come un eroe (che si tiene per sempre) sarebbe pagare tre
// volte tanto per un terzo della vita utile. Stessi ID dei tagli eroe
// (busta/trio/pacco/scrigno) apposta: la vetrina delle magie riusa gli
// stessi nomi e involucri (vedi genera-negozio.py), non ne servono di
// nuovi. Si ferma a dieci carte — sopra i dieci si ricomprano prima di
// finire le copie che si hanno, il taglio grande non serve quanto per
// gli eroi.
const OFFERTE_MAGIA = [
  { id: 'busta',   carte: 1,  costo:  2000, etichetta: null },
  { id: 'trio',    carte: 3,  costo:  4000, etichetta: null },
  { id: 'pacco',   carte: 5,  costo:  6000, etichetta: null },
  { id: 'scrigno', carte: 10, costo: 10000, etichetta: 'popolare' }
];

function costoPerCarta(offerta) { return offerta.costo / offerta.carte; }

// Quanto si risparmia rispetto al costo della singola carta. `tabella`
// facoltativa: le magie hanno la loro base (la busta da 1 magia), non
// quella degli eroi.
function scontoPercentuale(offerta, tabella = OFFERTE) {
  const base = tabella[0].costo;                  // 1 carta = prezzo pieno

function verificaProbabilita() {
  const somma = Object.values(PROBABILITA).reduce((a, b) => a + b, 0);

// fetta va a quella COMUNE più bassa disponibile, non a tutti. È anche
// il senso della parola: se non c'è una carta comune da dare, si dà la
// più comune che c'è — non si promuove il giocatore a una leggendaria.

// quando arriveranno carte a 1 e 2 stelle.

// Si ricavano dalla tabella: sono la stessa cosa detta una volta sola.
const LIVELLI_RARITA = Object.keys(PROBABILITA).map(Number).sort((a, b) => a - b);

function raritaDisponibili(catalogo) {
  const presenti = new Set((catalogo || []).map((c) => Number(c.rarita)));
  return LIVELLI_RARITA.filter((r) => presenti.has(r));

// I pesi da usare DAVVERO, dato quello che c'è nel catalogo.
//
// Di norma sono quelli della tabella. Ma se un livello non ha ancora
// nessuna carta — succede quando si prepara un'uscita nuova e le carte
// arrivano poche alla volta — la sua fetta va alla più COMUNE fra
// quelle presenti, mai spartita fra tutte. È il senso della parola: se
// non c'è una carta comune da dare, si dà la più comune che c'è; non si
// promuove il giocatore a una leggendaria.
// Verificato da un test apposta (engine/pacchetti.test.js).
function pesiEffettivi(disponibili) {

  if (!disponibili.length) return pesi;
  const piuComune = disponibili[0];
  for (const r of LIVELLI_RARITA) {
    if (!disponibili.includes(r)) pesi[piuComune] += PROBABILITA[r];
  }
  return pesi;

function estraiRarita(rng, disponibili) {
  if (!disponibili || !disponibili.length) return 1;
  const pesi = pesiEffettivi(disponibili);
  const totale = disponibili.reduce((s, r) => s + pesi[r], 0);
  let r = rng() * totale;
  for (const rarita of disponibili) {
    r -= pesi[rarita];
    if (r <= 0) return rarita;

function pescaDiRarita(catalogo, rarita, rng) {
  const candidate = catalogo.filter((c) => Number(c.rarita) === rarita);
  // se per quella rarità non esistono ancora carte, si scende di livello
  if (!candidate.length) {

      const alt = catalogo.filter((c) => Number(c.rarita) === r);
      if (alt.length) return alt[Math.floor(rng() * alt.length)];

    return catalogo[Math.floor(rng() * catalogo.length)];
  }
  return candidate[Math.floor(rng() * candidate.length)];

// Il seme si colora come sulla carta vera: rossi cuori e quadri.
const SEMI_ROSSI = ['♥', '♦'];

// Le carte magiche non hanno seme: il loro tipo si legge dall'id.
function eMagica(carta) {
  return !carta.seme;
}

function immagineCarta(idCarta) {
  return 'immagini/' + idCarta + '.webp';
}

// La carta illustrata: cornice, finestra con l'arte, testi al loro posto.
// `opzioni.posseduta` a false la spegne (sagoma di quello che manca).
function cartaIllustrata(carta, testi, opzioni) {
  const o = opzioni || {};

  const stelle = o.stelle || '';

  const seme = carta.seme
    ? '<span class="ci-seme' + (SEMI_ROSSI.includes(carta.seme) ? '' : ' nero') + '">' + carta.seme + '</span>'

  // Il nome e le stelle stanno nella barra in cima; il seme accanto al nome.
  const testata =
    '<div class="ci-testata">' +
      '<div class="ci-nome">' + (posseduta ? testi.nome : '? ? ?') + (seme ? ' ' + seme : '') + '</div>' +
      (stelle ? '<div class="ci-stelle">' + stelle + '</div>' : '') +
    '</div>';

  // I numeri solo per i personaggi: una Carta Magica non ha vita ne' attacco.
  const numeri = (!magica && posseduta)
    ? '<div class="ci-stat sx"><span class="ci-et">VITA</span><span class="ci-num">' + carta.vita + '</span></div>' +

    : '';

  const descrizione = (posseduta && testi.descrizione)
    ? '<div class="ci-desc">' + testi.descrizione + '</div>' : '';

  // Non tutte le carte hanno un'illustrazione: l'elenco di quelle che ce
  // l'hanno lo scrive il generatore leggendo la cartella vera, cosi' non
  // si puo' sbagliare (vedi dati_illustrazioni in carta_illustrata.py).
  // loading="lazy": l'album puo' avere decine di carte, e scaricarle
  // tutte insieme all'apertura vorrebbe dire aspettare per vedere le
  // prime. Cosi' arrivano quelle che si guardano.
  const haArte = typeof ILLUSTRAZIONI !== 'undefined' && ILLUSTRAZIONI.indexOf(carta.id) !== -1;
  const dentroFinestra = haArte
    ? '<img class="ci-arte" src="' + immagineCarta(carta.id) + '" alt="" loading="lazy" draggable="false">'
    : '<div class="ci-senza-arte">' + (carta.seme || (carta.tipo === 'trappola' ? '⚡' : '✦')) + '</div>';

  return '<div class="carta-illustrata' + (magica ? ' magica' : '') +
           (posseduta ? '' : ' manca') + '">' +
      '<div class="ci-finestra">' + dentroFinestra + '</div>' +
      '<img class="ci-cornice" src="' + immagineCarta(cornice) + '" alt="" loading="lazy" draggable="false">' +
      testata + numeri + descrizione +
    '</div>';
}

function leggi(chiave, fallback) {

// ============================================================
// IL PONTE
//
// Sharkini, album e pacchetti adesso stanno sul server. Il browser
// chiede e mostra: non decide più niente, e soprattutto non può più
// mentire — prima bastava aprire gli strumenti di sviluppo per darsi
// un milione di sharkini e tutte le carte rare.
//
// MA LE PAGINE DEVONO APRIRSI ANCHE COL DOPPIO CLIC.
// Serve per provarle in fretta, senza avviare niente. Allora ci sono
// due ponti con le stesse identiche funzioni: uno parla col server,
// l'altro si arrangia col browser. Chi li usa non sa quale dei due ha
// davanti — e questo tiene il resto del codice pulito da "se c'è il
// server allora... altrimenti...".
//
// La regola per scegliere è semplice e non mente: se la pagina è
// arrivata da un server, si parla col server. Se è stata aperta da un
// file, non c'è nessun server con cui parlare.
// ============================================================
const CI_SONO_ARRIVATO_DAL_SERVER = location.protocol === 'http:' || location.protocol === 'https:';

function creaPonteServer() {
  const CHIAVE_GETTONE = 'bb_gettone';
  let gettone = null;
  try { gettone = localStorage.getItem(CHIAVE_GETTONE); } catch (e) {}

  async function chiedi(via, corpo) {
    const risposta = await fetch(via, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...corpo, gettone })
    });
    return risposta.json();
  }

  return {
    dove: 'server',
    async io(nome) {
      const r = await chiedi('/api/io', { nome });
      if (r.gettone) {
        gettone = r.gettone;
        // Il gettone è l'unica cosa che il browser deve custodire: è
        // la chiave di casa. Perderlo vuol dire ripartire da zero,
        // finché non ci saranno gli account veri.
        try { localStorage.setItem(CHIAVE_GETTONE, gettone); } catch (e) {}
      }
      return r;
    },
    ritiraPremio: () => chiedi('/api/premio', {}),
    compra: (carte, tipo) => chiedi('/api/compra', { carte, tipo }),
    ricarica: (offerta) => chiedi('/api/ricarica', { offerta })
  };
}

// ------------------------------------------------------------
// IL PONTE DI RIPIEGO
// Quando la pagina è aperta col doppio clic non c'è nessun server: si
// fa tutto qui, come prima. È chiaramente falsificabile, e va bene —
// serve solo a guardare le pagine, non a giocare sul serio. Perché
// resti chiaro, ogni risposta porta `diProva: true` e le pagine lo
// dicono a chi guarda.
// ------------------------------------------------------------
function creaPonteBrowser() {
  const leggi = (c, d) => { try { const v = localStorage.getItem(c); return v === null ? d : JSON.parse(v); } catch (e) { return d; } };
  const scrivi = (c, v) => { try { localStorage.setItem(c, JSON.stringify(v)); } catch (e) {} };

  function statoAttuale() {
    const serie = Object.assign({}, SERIE_NUOVA, leggi('bb_sharkini', {}));
    const collezione = leggi('bb_collezione', {});
    const contatorePity = leggi('bb_pity', 0);
    const s = statoSerie(serie, Date.now());
    return {
      ok: true, diProva: true, serie, collezione, contatorePity,
      saldo: serie.saldo,
      carteDiverse: Object.keys(collezione).length,
      carteInTutto: Object.values(collezione).reduce((a, b) => a + b, 0),
      alleCarteAllaGaranzia: Math.max(0, SOGLIA_PITY - contatorePity),
      premio: {
        puoRitirare: s.puoRitirare, giorno: s.giorno, quanto: s.premio,
        serieRotta: s.serieRotta, giaRitiratoOggi: s.giaRitiratoOggi
      }
    };
  }

  return {
    dove: 'browser',
    async io() { return statoAttuale(); },
    async ritiraPremio() {
      const st = statoAttuale();
      const esito = ritiraPremio(st.serie, Date.now());
      if (esito.guadagno === 0) return { ok: false, diProva: true, motivo: 'Già ritirato oggi.', ...statoAttuale() };
      scrivi('bb_sharkini', esito.serie);
      return { ok: true, diProva: true, guadagno: esito.guadagno,
               serieRotta: esito.stato.serieRotta, ...statoAttuale() };
    },
    async compra(carte, tipo) {
      const st = statoAttuale();
      const offerta = offertaPerCarte(Number(carte), tipo);
      if (!offerta) return { ok: false, diProva: true, motivo: 'Quel pacchetto non esiste.' };
      if (st.serie.saldo < offerta.costo) {
        return { ok: false, diProva: true, motivo: 'Sharkini insufficienti.',
                 manca: offerta.costo - st.serie.saldo, costo: offerta.costo, saldo: st.serie.saldo };
      }
      // Anche qui, come sul server: dai pacchetti esce solo quello che
      // è davvero in vendita, i segnaposto della dotazione di benvenuto
      // restano fuori (vedi carteInVendita in engine/pacchetti.js).
      let bacino;
      try { bacino = carteDiTipo(carteInVendita(CATALOGO), tipo); }
      catch (e) { return { ok: false, diProva: true, motivo: e.message }; }
      if (!bacino.length) return { ok: false, diProva: true, motivo: 'Nessuna carta di quel tipo è ancora in vendita.' };
      const r = apriPacchetto(bacino, st.collezione, st.contatorePity, Math.random, offerta.carte);
      const collezione = { ...st.collezione };
      for (const c of r.carte) collezione[c.carta.id] = (collezione[c.carta.id] || 0) + 1;
      scrivi('bb_sharkini', { ...st.serie, saldo: st.serie.saldo - offerta.costo });
      scrivi('bb_collezione', collezione);
      scrivi('bb_pity', r.contatore);
      return { ok: true, diProva: true, costo: offerta.costo, carte: r.carte,
               pityScattato: r.pityScattato, ...statoAttuale() };
    },
    async ricarica(idOfferta) {
      const st = statoAttuale();
      const r = RICARICHE.find((x) => x.id === idOfferta);
      if (!r) return { ok: false, diProva: true, motivo: 'Quella ricarica non esiste.' };
      scrivi('bb_sharkini', { ...st.serie, saldo: st.serie.saldo + r.sharkini });
      return { ok: true, diProva: true, accreditati: r.sharkini, ...statoAttuale() };
    }
  };
}

// ------------------------------------------------------------
// PARTICELLE
// ------------------------------------------------------------
function scintille(x, y, quante, colore) {
  for (let i = 0; i < quante; i++) {
    const ang = Math.random() * Math.PI * 2;
    const dist = 60 + Math.random() * 340;
    const d = document.createElement('div');
    d.className = 'particella';
    const dim = 2 + Math.random() * 5;
    d.style.cssText =
      'left:' + x + 'px;top:' + y + 'px;width:' + dim + 'px;height:' + dim + 'px;' +
      'background:' + colore + ';box-shadow:0 0 ' + (dim * 3) + 'px ' + colore + ';' +
      '--dx:' + (Math.cos(ang) * dist).toFixed(0) + 'px;--dy:' + (Math.sin(ang) * dist).toFixed(0) + 'px;' +
      'animation-duration:' + (0.7 + Math.random() * 0.8).toFixed(2) + 's';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 1600);
  }
}

function coriandoli(quanti) {
  const colori = ['#ffd97a', '#ff8fa3', '#8fd8ff', '#c0ff9b', '#e0a9ff'];
  for (let i = 0; i < quanti; i++) {
    const d = document.createElement('div');
    d.className = 'coriandolo';
    d.style.cssText =
      'left:' + (Math.random() * 100) + 'vw;top:-4vh;' +
      'background:' + colori[i % colori.length] + ';' +
      '--dx:' + (Math.random() * 200 - 100).toFixed(0) + 'px;' +
      '--giro:' + (Math.random() * 1200 - 600).toFixed(0) + 'deg;' +
      'animation-duration:' + (2.2 + Math.random() * 2).toFixed(2) + 's;' +
      'animation-delay:' + (Math.random() * 0.5).toFixed(2) + 's';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 5200);
  }
}

function scuotiSchermo(forza) {
  const b = document.body;
  let t = 0;
  const passo = () => {
    t += 1;
    if (t > 12) { b.style.transform = ''; return; }
    const f = forza * (1 - t / 12);
    b.style.transform = 'translate(' + ((Math.random() - 0.5) * f).toFixed(1) + 'px,' +
                                       ((Math.random() - 0.5) * f).toFixed(1) + 'px)';
    requestAnimationFrame(passo);
  };
  passo();
}

// se il saldo non basta il pacchetto non è nemmeno stato disegnato:
// non c'è niente da toccare
if ($('pacchetto')) $('pacchetto').addEventListener('click', apriIlPacchetto, { once: true });
// SALTA: chi non vuole aspettare tocca/tira/gira una carta alla volta
// passa dritto al riepilogo con tutte le figurine — mostraRiepilogo
// legge solo risultato.carte, quindi funziona a qualunque punto della
// sequenza ci si trovi, anche prima di aver girato la prima carta.
if ($('saltaApertura')) $('saltaApertura').addEventListener('click', mostraRiepilogo);

// LE CARTE LE ESTRAE IL SERVER, non questa pagina. Qui si chiede di
// aprire un pacchetto e si mette in scena quello che risponde: se
// l'estrazione avvenisse qui, basterebbe cambiare due righe nel browser
// per farsi uscire solo carte a cinque stelle.
async function apriIlPacchetto() {
  $('pacchetto').style.pointerEvents = 'none';

  // LO STRAPPO PARTE SUBITO, la domanda al server viaggia insieme.
  // Se aspettassimo la risposta prima di muovere il pacchetto, fra il
  // dito e l'animazione ci sarebbe il tempo della rete — un ritardo
  // che non si capisce e che fa sembrare la pagina rotta. Così invece
  // lo strappo dura il suo secondo abbondante e la risposta arriva
  // dentro quel tempo, senza che nessuno se ne accorga.
  const inArrivo = SCORTA.compra(QUANTE, TIPO_PACCHETTO);
  avviaLoStrappo();

  const r = await inArrivo;
  if (!r || !r.ok) {
    // Il server ha detto di no: si torna indietro. Meglio un passo
    // all'indietro brutto che far vedere carte che non sono tue.
    if (r) mio = { ...mio, ...r };
    $('pacchetto').classList.remove('strappato');
    saldoInsufficiente();
    return;
  }
  risultato = r;
  mio = r;
  aggiornaBorsellino();

  // segnaposti: uno per carta (li disegno appena so quante sono)
  if (QUANTE <= 12) {
    $('segnaposti').innerHTML = Array.from({ length: QUANTE }, () => '<div class="segnaposto"></div>').join('');
  } else {
    $('segnaposti').innerHTML = '';
  }

  setTimeout(() => {
    $('fase-chiuso').style.display = 'none';
    $('saltaApertura').classList.add('mostra');
    mostraCarta(0);
  }, 1050);   // il tempo che linguetta e corpo escano di scena
}

// La messinscena dello strappo, staccata dalla richiesta al server.
function avviaLoStrappo() {
  const p = $('pacchetto').getBoundingClientRect();
  $('pacchetto').classList.add('strappato');
  // le scintille partono dalla linea dello strappo, non dal centro
  const yStrappo = p.top + p.height * 0.19;
  setTimeout(() => {
    for (let i = 0; i < 9; i++) {
      scintille(p.left + p.width * (0.1 + 0.1 * i), yStrappo, 7, '#ffd97a');
    }
    scuotiSchermo(16);
  }, 150);

}

// ------------------------------------------------------------
// UNA CARTA ALLA VOLTA
// Arriva coperta, si tocca, si gira. Più è rara più l'attesa vale.
// ------------------------------------------------------------
function mostraCarta(i) {
  indice = i;
  girata = false;
  $('palco').classList.add('attivo');
  const c = risultato.carte[i];
  const st = STILE_RARITA[c.rarita] || STILE_RARITA[1];
  const t = testo(c.carta.id);

  // segnaposti
  [...$('segnaposti').children].forEach((s, k) => {
    s.className = 'segnaposto' + (k < i ? ' fatto' : (k === i ? ' corrente' : ''));
  });

  // prepara il fronte, ancora nascosto.
  // La carta la disegna il pezzo condiviso — la stessa che si vede
  // nell'album e al tavolo: chi apre un pacchetto deve riconoscere
  // subito quello che ritrovera' poi in collezione.
  $('fronte').style.setProperty('--bordo', st.colore);
  $('fronte').style.setProperty('--alone', st.alone);
  $('fronte').style.setProperty('--velo', st.velo);
  $('fronte').innerHTML =
    cartaIllustrata(c.carta, t, { stelle: stelle(c.rarita) }) +
    '<div class="etichetta ' + (c.nuova ? 'nuova' : 'doppia') + '">' +
      (c.nuova ? 'NUOVA' : 'DOPPIONE · +' + c.rimborso + ' monete') + '</div>';

  const scena = $('scena');
  const carta = $('carta3d');
  carta.classList.remove('girata');
  scena.classList.add('viva');
  // fa ripartire l'animazione di arrivo
  carta.style.animation = 'none';
  void carta.offsetWidth;
  carta.style.animation = '';

  $('aura').className = 'aura';
  $('raggi').style.opacity = '0';
  $('suggerimento').textContent = 'Tocca la carta per girarla  ·  ' + (i + 1) + ' di ' + risultato.carte.length;

  carta.onclick = () => giraCarta(c, st);
}

function giraCarta(c, st) {
  if (girata) { avanti(); return; }
  girata = true;

  const carta = $('carta3d');
  carta.classList.add('girata');

  // a metà giro, quando la faccia si scopre, parte lo spettacolo
  setTimeout(() => {
    const r = carta.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;

    $('aura').style.setProperty('--alone', st.alone);
    $('aura').className = 'aura accesa';
    scintille(cx, cy, st.particelle, st.colore);
    if (st.raggi) $('raggi').style.opacity = String(st.raggi);
    if (st.scossa) { scuotiSchermo(c.rarita === 5 ? 22 : 12); suonaRivelazioneRara(); }
    if (c.rarita === 5) coriandoli(90);

    $('suggerimento').textContent = indice + 1 < risultato.carte.length
      ? 'Tocca ancora per la prossima carta'
      : 'Tocca ancora per vedere il bottino';
  }, 360);
}

function avanti() {
  if (indice + 1 < risultato.carte.length) {
    $('scena').classList.remove('viva');
    $('aura').className = 'aura';
    $('raggi').style.opacity = '0';
    setTimeout(() => mostraCarta(indice + 1), 120);
  } else {
    mostraRiepilogo();
  }
}

// ------------------------------------------------------------
// RIEPILOGO
// ------------------------------------------------------------
function mostraRiepilogo() {
  // la collezione si aggiorna solo ora, a pacchetto visto
  // l'album l'ha già aggiornato il server: qui non si scrive niente

  $('scena').classList.remove('viva');
  $('aura').className = 'aura';
  $('raggi').style.opacity = '0';
  $('segnaposti').style.display = 'none';
  $('suggerimento').textContent = '';
  $('palco').classList.remove('attivo');
  $('saltaApertura').classList.remove('mostra');

  const migliore = risultato.carte[risultato.carte.length - 1];
  $('titoloRiep').textContent = risultato.pityScattato
    ? 'Pacchetto garantito!'
    : (migliore.rarita >= 4 ? 'Che fortuna!' : 'Il tuo bottino');

  // Raggruppate per carta: con un pacchetto grande (25, 50 carte) una
  // tessera per ogni singola estrazione era un muro illeggibile, e la
  // stessa carta usciva ripetuta identica più volte senza dire quante.
  // Qui si conta quante copie di ognuna sono arrivate in QUESTA apertura,
  // e la tessera lo dice con un "×N" invece di ripetersi.
  const gruppi = [];
  const perId = new Map();
  for (const c of risultato.carte) {
    let g = perId.get(c.carta.id);
    if (!g) { g = { carta: c.carta, rarita: c.rarita, quante: 0, nuove: 0 }; perId.set(c.carta.id, g); gruppi.push(g); }
    g.quante += 1;
    if (c.nuova) g.nuove += 1;
  }

  $('griglia').innerHTML = gruppi.map((g, i) => {
    const st = STILE_RARITA[g.rarita] || STILE_RARITA[1];
    const t = testo(g.carta.id);
    const tuttaNuova = g.nuove === g.quante;
    const parzialeNuova = g.nuove > 0 && g.nuove < g.quante;
    const etichetta = tuttaNuova ? 'NUOVA' : (parzialeNuova ? (g.nuove + ' NUOVA + ' + (g.quante - g.nuove) + ' DOPPIA') : 'DOPPIA');
    // Nel riepilogo le carte sono piccole: si passa il nome ma non la
    // descrizione, che a quella misura il CSS nasconde comunque.
    return '<div class="mini" style="--bordo:' + st.colore + ';--alone:' + st.alone +
           ';animation-delay:' + (i * 0.09).toFixed(2) + 's">' +
      cartaIllustrata(g.carta, { nome: t.nome }, { stelle: stelle(g.rarita) }) +
      (g.quante > 1 ? '<div class="quante">×' + g.quante + '</div>' : '') +
      '<div class="tag ' + (tuttaNuova ? 'nuova' : 'doppia') + '">' + etichetta + '</div>' +
    '</div>';
  }).join('');

  const nuove = risultato.carte.filter((c) => c.nuova).length;
  const monete = rimborsoTotale(risultato);
  $('incasso').innerHTML =
    '<b>' + nuove + '</b> carte nuove su ' + risultato.carte.length +
    (monete ? ' · doppioni convertiti in <b>' + monete + '</b> monete' : '') +
    ' · ancora <b>' + risultato.alleCarteAllaGaranzia + '</b> carte alla ★5 garantita';

  $('riepilogo').classList.add('viva');
  if (migliore.rarita >= 4) coriandoli(60);
}

// per i controlli automatici
window.__prova = {
  apri: apriIlPacchetto,
  gira: () => $('carta3d').click(),
  stato: () => ({ indice, girata, totale: risultato ? risultato.carte.length : 0 })
};
})();
</script>
