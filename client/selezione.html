<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Burraco Legends — Selezione</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2a1e12">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root {
    --bg: #14101c;
    --bg-panel: #1e1830;
    --bg-card: #241d38;
    --bg-card-hover: #2d2447;
    --border: #3a2f57;
    --text: #ece7f7;
    --text-dim: #a397c2;
    --gold: #d9ad4f;      /* Sorpresa: "bordo/luce gialla fuoco" (spec §6) */
    --blue: #3fa9f5;      /* Trappola: "bordo/luce blu elettrico" (spec §6) */
    --red: #d9536a;       /* Cuori / Quadri */
    --pale: #e8e6f0;      /* Fiori / Picche */
    --ok: #58c48a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    background:
      radial-gradient(circle at top, rgba(32,24,53,0.6), rgba(12,9,17,0.82)),
      url('immagini/decorazioni/sfondo-tavolo.webp') center / cover no-repeat;
    color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh;
  }
  header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
  h1 { margin: 0; font-size: 1.6rem; letter-spacing: 0.5px; }
  h1 span { color: var(--gold); }
  .subtitle { color: var(--text-dim); margin-top: 4px; font-size: 0.9rem; }
  .lang-switch { display: flex; gap: 6px; }
  .lang-switch button {
    background: var(--bg-card); border: 1px solid var(--border); color: var(--text-dim);
    padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;
  }
  .lang-switch button.active { color: var(--bg); background: var(--gold); border-color: var(--gold); font-weight: 600; }

  section { margin-bottom: 32px; }
  section h2 { font-size: 1.1rem; margin-bottom: 4px; }
  section .hint { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 14px; }

  .suits-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  @media (max-width: 900px) { .suits-row { grid-template-columns: repeat(2, 1fr); } }

  .suit-col {
    background:
      linear-gradient(168deg, rgba(15,10,7,0.55), rgba(15,10,7,0.72)),
      url('immagini/decorazioni/pannello-premio.webp') center / cover no-repeat;
    border: 1px solid var(--border); border-radius: 10px; padding: 12px;
  }
  .suit-col-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-weight: 600; }
  .suit-symbol { font-size: 1.3rem; }
  .suit-symbol.red { color: var(--red); }
  .suit-symbol.pale { color: var(--pale); }

  .slot {
    border: 2px dashed var(--border); border-radius: 8px; padding: 14px; text-align: center;
    cursor: pointer; color: var(--text-dim); transition: 0.15s;
  }
  .slot:hover { border-color: var(--gold); color: var(--text); }
  .slot.filled {
    border-style: solid; border-color: var(--ok); color: var(--text); text-align: left;
    background:
      linear-gradient(168deg, rgba(15,10,7,0.45), rgba(15,10,7,0.65)),
      url('immagini/decorazioni/pannello-premio.webp') center / cover no-repeat;
  }
  .slot .name { font-weight: 700; margin-bottom: 2px; }
  .slot .stats { font-size: 0.8rem; color: var(--text-dim); }
  .slot .rarity { color: var(--gold); font-size: 0.85rem; margin-top: 2px; }

  .picker { margin-top: 10px; display: none; flex-direction: column; gap: 6px; }
  /* Aperto, il picker non spinge più via il resto della pagina: si
     sovrappone a tutto schermo, come un pannello vero, invece di
     allungare la colonna e far scorrere via ciò che sta sotto. */
  .picker.open {
    display: flex; position: fixed; inset: 0; z-index: 200; margin: 0;
    padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
    background: rgba(10, 7, 16, 0.94); overflow-y: auto;
  }
  .picker-testata {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px; flex: 0 0 auto;
  }
  .picker-testata .titolo { font-size: 1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .picker-chiudi {
    background: var(--bg-card); border: 1px solid var(--border); color: var(--text);
    width: 34px; height: 34px; border-radius: 8px; font-size: 1.1rem; cursor: pointer;
    display: grid; place-items: center;
  }
  .picker-chiudi:hover { border-color: var(--gold); }
  .picker-item {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px; cursor: pointer; font-size: 0.85rem;
    display: flex; flex-direction: column; gap: 4px;
  }
  .picker-item:hover { background: var(--bg-card-hover); border-color: var(--gold); }
  .picker-item .riga1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .picker-item .con-mini { flex: 1 1 auto; min-width: 0; }
  .picker-item .con-mini .pi-nome {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block;
  }
  .picker-item .stats { color: var(--text-dim); flex: 0 0 auto; white-space: nowrap; }
  .picker-item .pi-desc { color: var(--text-dim); font-size: 0.78rem; line-height: 1.3; }
  .picker-vuoto {
    color: var(--text-dim); font-size: 0.85rem; line-height: 1.4;
    padding: 14px 10px; text-align: center; border: 1px dashed var(--border); border-radius: 6px;
  }

  .magic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .magic-card {
    background:
      linear-gradient(168deg, rgba(15,10,7,0.45), rgba(15,10,7,0.65)),
      url('immagini/decorazioni/pannello-premio.webp') center / cover no-repeat;
    border: 2px solid var(--border); border-radius: 10px; padding: 12px; cursor: pointer;
    transition: 0.15s;
  }
  .magic-card:hover { background: var(--bg-card-hover); }
  .magic-card.tipo-sorpresa { box-shadow: inset 0 0 0 1px transparent; }
  .magic-card.tipo-sorpresa.selected { border-color: var(--gold); box-shadow: 0 0 10px rgba(217,173,79,0.5); }
  .magic-card.tipo-trappola.selected { border-color: var(--blue); box-shadow: 0 0 10px rgba(63,169,245,0.5); }
  .magic-card .tag {
    display: inline-block; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px;
    padding: 2px 6px; border-radius: 4px; margin-bottom: 6px;
  }
  .tag.sorpresa { background: rgba(217,173,79,0.18); color: var(--gold); }
  .tag.trappola { background: rgba(63,169,245,0.18); color: var(--blue); }
  .magic-card .name { font-weight: 700; margin-bottom: 4px; }
  .magic-card .desc { font-size: 0.8rem; color: var(--text-dim); }
  .magic-card .rarity { color: var(--gold); font-size: 0.8rem; margin-top: 6px; }
  .magic-card .effect-code { font-size: 0.7rem; color: var(--text-dim); margin-top: 6px; font-family: monospace; }

  .section-controls { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; font-size: 0.85rem; color: var(--text-dim); }
  .section-controls select {
    background: var(--bg-card); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 8px; font-size: 0.85rem;
  }

  footer {
    position: sticky; bottom: 0; background: var(--bg-panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
  }
  .progress { font-size: 0.9rem; color: var(--text-dim); }
  .progress b { color: var(--text); }
  .progress .done { color: var(--ok); }
  #entraBtn {
    background: var(--gold); color: #1b1220; border: none; padding: 10px 20px; border-radius: 8px;
    font-weight: 700; cursor: pointer; font-size: 0.95rem;
  }
  #entraBtn:disabled { background: var(--border); color: var(--text-dim); cursor: not-allowed; }

  #summaryPanel {
    display: none; margin-top: 16px; background: var(--bg-panel); border: 1px solid var(--ok);
    border-radius: 10px; padding: 16px;
  }
  #summaryPanel.open { display: block; }
  #summaryPanel h3 { margin-top: 0; color: var(--ok); }
  #summaryPanel pre { background: var(--bg); padding: 10px; border-radius: 6px; overflow-x: auto; font-size: 0.8rem; }
  .torna { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 1.275rem;
           color: var(--muted, #9a8fb5); text-decoration: none; }
  .torna .icona-torna { width: 60px; height: 60px; object-fit: contain; }
  .torna:hover { color: var(--ok, #d4af37); }

  /* --- le miniature delle illustrazioni --- */
  .con-mini { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .con-mini .testi { min-width: 0; }
  .mini-arte {
    width: 38px; height: 38px; border-radius: 7px; object-fit: cover; flex: 0 0 auto;
    border: 1px solid var(--border); background: #191430;
  }
  .mini-vuota {
    width: 38px; height: 38px; border-radius: 7px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border); background: #191430;
    color: var(--text-dim); font-size: 1.1rem;
  }
  .magic-card .mini-arte, .magic-card .mini-vuota {
    width: 100%; height: 92px; border-radius: 8px; margin-bottom: 8px;
  }
</style>
</head>
<body>

<header>
  <div>
    <!-- Da qui si entrava e non si usciva più: nessun modo di tornare
         alla home se non col tasto indietro del browser, che su telefono
         metà delle volte non c'è. -->
    <a class="torna" href="home.html"><img src="immagini/decorazioni/torna-home.webp" alt="" class="icona-torna">Torna alla home</a>
    <h1>Burraco <span>Legends</span></h1>
    <div class="subtitle" data-i18n-key="sottotitolo">Scegli 4 Personaggi (uno per seme) e 3 Carte Magiche: sono quelli con cui scenderai in campo.</div>
  </div>
  <div class="lang-switch" id="langSwitch"></div>
</header>

<section>
  <h2 data-i18n-key="titoloPersonaggi">Personaggi</h2>
  <div class="hint" data-i18n-key="hintPersonaggi">Uno obbligatorio per ciascun seme.</div>
  <div class="section-controls">
    <label data-i18n-key="ordinaPer">Ordina per:</label>
    <select id="sortPersonaggiSelect">
      <option value="punteggio" data-i18n-key="ordinaPunteggio">Punteggio (rarità)</option>
      <option value="nome" data-i18n-key="ordinaNome">Nome</option>
    </select>
  </div>
  <div class="suits-row" id="suitsRow"></div>
</section>

<section>
  <h2 data-i18n-key="titoloMagiche">Carte Magiche</h2>
  <div class="hint" data-i18n-key="hintMagiche">Scegline esattamente 3, mix libero fra Sorpresa e Trappola.</div>
  <div class="section-controls">
    <label data-i18n-key="ordinaPer">Ordina per:</label>

      <option value="punteggio" data-i18n-key="ordinaPunteggio">Punteggio (rarità)</option>
      <option value="nome" data-i18n-key="ordinaNome">Nome</option>
    </select>
  </div>
  <div class="magic-grid" id="magicGrid"></div>
</section>

<div id="summaryPanel">
  <h3 data-i18n-key="riepilogoTitolo">Squadra pronta</h3>
  <div id="summaryText"></div>
  <pre id="summaryJson"></pre>
</div>

<footer>
  <div class="progress" id="progressText"></div>
  <button id="entraBtn" disabled data-i18n-key="entraBtn">Conferma il mazzo</button>
</footer>

const SUPPORTED_LANGS = ['it', 'en', 'es', 'pt'];

// spec §12bis: rileva la lingua di sistema al primo avvio, fallback su
// inglese se non è fra le 4 supportate. Qui, senza un "profilo salvato",
// la si ricalcola a ogni apertura — in app andrebbe letta/scritta dalle
// impostazioni utente.
function detectLocale() {
  const nav = (navigator.language || 'en').slice(0, 2).toLowerCase();
  return SUPPORTED_LANGS.includes(nav) ? nav : 'en';
}

// ------------------------------------------------------------
// SOLO LE CARTE CHE SI POSSIEDONO DAVVERO
// Questa pagina mostrava l'intero catalogo, comprate o no: si poteva
// mettere in squadra qualunque eroe, anche uno mai visto in album.
// Sharkini, album e pacchetti stanno sul server (vedi server/giocatori.js
// e strumenti/ponte.py, usati da negozio/album/spacchetta): qui manca
// lo stesso controllo, ed e' un buco vero — un giocatore poteva schierare
// carte che non aveva comprato. Si legge la collezione con lo stesso
// gettone delle altre pagine, non un ponte nuovo: qui basta sapere COSA
// si possiede, non comprare o aprire pacchetti.
// ------------------------------------------------------------
const CI_SONO_ARRIVATO_DAL_SERVER = location.protocol === 'http:' || location.protocol === 'https:';
let COLLEZIONE = {};

async function caricaCollezione() {
  if (!CI_SONO_ARRIVATO_DAL_SERVER) {
    // pagina aperta col doppio clic, senza server: si legge quello che
    // ha lasciato il ponte di ripiego delle altre pagine (di prova)
    try { COLLEZIONE = JSON.parse(localStorage.getItem('bb_collezione') || '{}'); } catch (e) { COLLEZIONE = {}; }
    return;
  }
  let gettone = null;
  try { gettone = localStorage.getItem('bb_gettone'); } catch (e) {}
  try {
    const risposta = await fetch('/api/io', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ gettone })
    });
    const r = await risposta.json();
    if (r && r.gettone) { try { localStorage.setItem('bb_gettone', r.gettone); } catch (e) {} }
    COLLEZIONE = (r && r.collezione) || {};
  } catch (e) {
    console.warn('Non riesco a leggere la collezione dal server:', e);
    COLLEZIONE = {};
  }
}
function posseggo(id) { return (COLLEZIONE[id] || 0) > 0; }

let currentLang = detectLocale();
const state = {
  personaggi: { '♥': null, '♦': null, '♣': null, '♠': null },
  magiche: [],
  openPicker: null,
  // Con pochi personaggi/carte per gruppo l'ordine non si nota, ma il roster
  // crescerà (spec §10: 24-32 personaggi, poi carte nuove ogni mese) — quindi
  // fin da ora le liste si ordinano per punteggio (rarità) decrescente di
  // default, con la possibilità di ordinare per nome. "Punteggio" qui è la
  // rarità 1-5 stelle di ogni carta: è l'unico valore di classificazione che
  // la spec definisce (vedi anche il "valore" del pity system, §10) — se in
  // futuro serve un punteggio diverso da rarità/valore, va aggiornato qui.
  sort: { personaggi: 'punteggio', magiche: 'punteggio' }
};

function t(key) { return I18N[currentLang].ui[key]; }
// I nomi e le descrizioni delle carte arrivano da cards/i18n, non piu'
// da una copia incollata dentro questa pagina: erano rimaste indietro
// di ventine di carte.
function cardText(id) {
  const perLingua = CARTE_TESTI[currentLang] || CARTE_TESTI.it || {};
  return perLingua[id] || { nome: id, descrizione: '' };
}
function redSuit(s) { return s === '♥' || s === '♦'; }

// LA MINIATURA DELL'ILLUSTRAZIONE.
// Scegliere il mazzo guardando solo dei nomi e' come scegliere un
// libro dall'indice: l'illustrazione e' quello che si ricorda di una
// carta. Le carte senza disegno (i segnaposto storici) mostrano il
// loro seme, non un'immagine rotta.
function miniaturaCarta(id, seme) {
  if (ILLUSTRAZIONI.indexOf(id) !== -1) {
    return '<img class="mini-arte" src="immagini/' + id + '.webp" alt="" loading="lazy" draggable="false">';
  }
  return '<span class="mini-vuota">' + (seme || '✦') + '</span>';
}

function sortCards(list, mode) {
  const arr = list.slice();
  arr.sort((a, b) => {
    if (mode === 'nome') return cardText(a.id).nome.localeCompare(cardText(b.id).nome, currentLang);
    return (b.rarita - a.rarita) || cardText(a.id).nome.localeCompare(cardText(b.id).nome, currentLang);
  });
  return arr;
}

function renderLangSwitch() {
  const el = document.getElementById('langSwitch');
  el.innerHTML = '';
  for (const lang of SUPPORTED_LANGS) {
    const btn = document.createElement('button');
    btn.textContent = lang.toUpperCase();
    if (lang === currentLang) btn.classList.add('active');
    btn.onclick = () => { currentLang = lang; renderAll(); };
    el.appendChild(btn);
  }
}

function renderSuits() {
  const row = document.getElementById('suitsRow');
  row.innerHTML = '';
  for (const seme of ['♥', '♦', '♣', '♠']) {
    const col = document.createElement('div');
    col.className = 'suit-col';

    const header = document.createElement('div');
    header.className = 'suit-col-header';
    header.innerHTML = `<span class="suit-symbol ${redSuit(seme) ? 'red' : 'pale'}">${seme}</span>`;
    col.appendChild(header);

    const selected = state.personaggi[seme];
    const slot = document.createElement('div');
    slot.className = 'slot' + (selected ? ' filled' : '');
    if (selected) {
      const txt = cardText(selected.id);
      slot.innerHTML = `<div class="con-mini">${miniaturaCarta(selected.id, seme)}
        <div class="testi"><div class="name">${txt.nome}</div>
        <div class="stats">${t('vita')} ${selected.vita} · ${t('att')} ${selected.att}</div>
        <div class="rarity">${'★'.repeat(selected.rarita)}${'☆'.repeat(5 - selected.rarita)}</div></div></div>`;
    } else {
      slot.textContent = t('scegli');
    }
    slot.onclick = () => { state.openPicker = state.openPicker === seme ? null : seme; renderSuits(); };
    col.appendChild(slot);

    const picker = document.createElement('div');
    picker.className = 'picker' + (state.openPicker === seme ? ' open' : '');
    const testata = document.createElement('div');
    testata.className = 'picker-testata';
    testata.innerHTML = `<span class="titolo"><span class="suit-symbol ${redSuit(seme) ? 'red' : 'pale'}">${seme}</span>${t('scegli')}</span>`;
    const chiudi = document.createElement('button');
    chiudi.className = 'picker-chiudi';
    chiudi.setAttribute('aria-label', 'Chiudi');
    chiudi.textContent = '✕';
    chiudi.onclick = (ev) => { ev.stopPropagation(); state.openPicker = null; renderSuits(); };
    testata.appendChild(chiudi);
    picker.appendChild(testata);
    // SOLO QUELLI CHE SI POSSIEDONO: vedi caricaCollezione() e posseggo()
    // piu' in alto. Prima qui c'era l'intero catalogo, comprato o no.
    const disponibili = sortCards(PERSONAGGI.filter((c) => c.seme === seme && posseggo(c.id)), state.sort.personaggi);
    if (!disponibili.length) {
      const vuoto = document.createElement('div');
      vuoto.className = 'picker-vuoto';
      vuoto.textContent = t('pickerVuotoPersonaggi');
      picker.appendChild(vuoto);
    }
    for (const p of disponibili) {
      const txt = cardText(p.id);
      const item = document.createElement('div');
      item.className = 'picker-item';
      item.innerHTML = `<div class="riga1"><span class="con-mini">${miniaturaCarta(p.id, p.seme)}<span class="pi-nome">${txt.nome} ${'★'.repeat(p.rarita)}</span></span><span class="stats">${t('vita')} ${p.vita} · ${t('att')} ${p.att}</span></div><div class="pi-desc">${txt.descrizione || ''}</div>`;
      item.onclick = (ev) => {
        ev.stopPropagation();
        state.personaggi[seme] = p;
        state.openPicker = null;
        renderAll();
      };
      picker.appendChild(item);
    }
    col.appendChild(picker);
    row.appendChild(col);
  }
}

function renderMagic() {
  const grid = document.getElementById('magicGrid');
  grid.innerHTML = '';
  // Stesso filtro dei personaggi: solo le Carte Magiche possedute davvero.
  const ordinate = sortCards(MAGICHE.filter((m) => posseggo(m.id)), state.sort.magiche);
  if (!ordinate.length) {
    const vuoto = document.createElement('div');
    vuoto.className = 'picker-vuoto';
    vuoto.textContent = t('pickerVuotoMagiche');
    grid.appendChild(vuoto);
  }
  for (const m of ordinate) {
    const txt = cardText(m.id);
    const isSelected = state.magiche.includes(m.id);
    const card = document.createElement('div');
    card.className = `magic-card tipo-${m.tipo}` + (isSelected ? ' selected' : '');
    card.innerHTML = `<span class="tag ${m.tipo}">${m.tipo}</span>
      ${miniaturaCarta(m.id, m.tipo === 'trappola' ? '⚡' : '✦')}
      <div class="name">${txt.nome}</div>
      <div class="desc">${txt.descrizione}</div>
      <div class="rarity">${'★'.repeat(m.rarita)}${'☆'.repeat(5 - m.rarita)}</div>
`;
    card.onclick = () => {
      if (isSelected) {
        state.magiche = state.magiche.filter((id) => id !== m.id);
      } else if (state.magiche.length < 3) {
        state.magiche.push(m.id);
      }
      renderAll();
    };
    grid.appendChild(card);
  }
}

function renderStaticText() {
  document.querySelectorAll('[data-i18n-key]').forEach((el) => {
    const key = el.getAttribute('data-i18n-key');
    if (typeof I18N[currentLang].ui[key] === 'string') el.textContent = I18N[currentLang].ui[key];
  });
}

function renderFooter() {
  const nPers = Object.values(state.personaggi).filter(Boolean).length;
  const nMagic = state.magiche.length;
  // Le Carte Magiche sono facoltative: bastano gli eroi per confermare.
  // La spunta sul numero di magiche resta com'e' (si accende a 3) solo
  // per dire "ne hai prese il massimo", non perche' serva per forza.
  document.getElementById('progressText').innerHTML = t('progresso')(nPers, nMagic)
    .replace(`${nPers}/4`, `<b class="${nPers === 4 ? 'done' : ''}">${nPers}/4</b>`)
    .replace(`${nMagic}/3`, `<b class="${nMagic === 3 ? 'done' : ''}">${nMagic}/3</b>`);
  document.getElementById('entraBtn').disabled = !(nPers === 4);
}

function renderAll() {
  renderLangSwitch();
  renderStaticText();
  renderSuits();
  renderMagic();
  renderFooter();
}

document.getElementById('sortPersonaggiSelect').addEventListener('change', (e) => {
  state.sort.personaggi = e.target.value;
  renderSuits();
});
document.getElementById('sortMagicheSelect').addEventListener('change', (e) => {
  state.sort.magiche = e.target.value;
  renderMagic();
});

// ------------------------------------------------------------
// IL MAZZO SCELTO VA AL TAVOLO
//
// Fino a ieri questo bottone apriva un riquadro che diceva "qui la
// selezione VERREBBE inviata": si sceglievano quattro eroi e tre carte
// magiche, si premeva, e non succedeva niente. Il tavolo intanto
// giocava sempre con due squadre fisse scritte nel codice.
//
// Ora la scelta si mette da parte nel browser e il tavolo la legge
// all'avvio. Chi non ha mai scelto niente continua a trovare la squadra
// di prima: il gioco non deve costringere a passare di qui.
// ------------------------------------------------------------
const DOVE_SI_SALVA_IL_MAZZO = 'bb_mazzo';

document.getElementById('entraBtn').addEventListener('click', () => {
  const nPers = Object.values(state.personaggi).filter(Boolean).length;
  if (nPers !== 4) return;
  const selezione = {
    personaggi: Object.fromEntries(Object.entries(state.personaggi).map(([s, c]) => [s, c.id])),
    carteMagiche: state.magiche
  };
  try {
    localStorage.setItem(DOVE_SI_SALVA_IL_MAZZO, JSON.stringify(selezione));
  } catch (e) {
    // browser che non lascia salvare niente: meglio dirlo che partire
    // con una squadra diversa da quella scelta senza spiegare perche'
    alert(currentLang === 'it'
      ? 'Non riesco a ricordare la scelta su questo browser: la partita userà la squadra predefinita.'
      : 'I cannot remember your choice in this browser: the match will use the default team.');
  }
  // DOVE SI TORNA DOPO AVER CONFERMATO.
  // Prima si finiva dritti al tavolo contro il computer, e chi era
  // arrivato qui per prepararsi a una partita con un amico si ritrovava
  // di colpo a giocare da solo. Confermare un mazzo non e' cominciare
  // una partita: si torna da dove si e' arrivati, e la partita la si
  // sceglie dopo.
  const daDoveVengo = document.referrer || '';
  const dentroCasa = ['sala.html', 'home.html', 'negozio.html', 'album.html']
    .find((pagina) => daDoveVengo.includes(pagina));
  window.location.href = dentroCasa || 'home.html';
});

// Se un mazzo era gia' stato scelto, si ritrova selezionato: rifarlo da
// capo ogni volta sarebbe una punizione per chi torna. Ma solo se le
// carte sono ancora possedute: una scelta fatta prima di questo
// controllo (o una carta persa da allora) non deve ritrovarsi in
// squadra senza che sia mai passata dal picker filtrato.
function riprendiIlMazzoDiPrima() {
  let salvato = null;
  try { salvato = JSON.parse(localStorage.getItem(DOVE_SI_SALVA_IL_MAZZO) || 'null'); } catch (e) {}
  if (!salvato || !salvato.personaggi) return;
  for (const [seme, id] of Object.entries(salvato.personaggi)) {
    const carta = PERSONAGGI.find((c) => c.id === id && posseggo(c.id));
    if (carta && state.personaggi[seme] !== undefined) state.personaggi[seme] = carta;
  }
  if (Array.isArray(salvato.carteMagiche)) {
    state.magiche = salvato.carteMagiche.filter((id) => MAGICHE.some((c) => c.id === id) && posseggo(id)).slice(0, 3);
  }
}

(async function avvia() {
  await caricaCollezione();
  riprendiIlMazzoDiPrima();
  renderAll();
})();
</script>
