<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Burraco Legends — Album</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2a1e12">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root {
    --oro: #e8c46a; --oro-chiaro: #fff0c2; --oro-scuro: #9a6f21;
    --pergamena: #f2e6cc; --tenue: #b7a686; --notte: #0d0a13;
    --verde: #58c48a;
    --r1: #8d93a3; --r2: #63c27e; --r3: #4aa3f0; --r4: #b070f5; --r5: #ffb347;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif; color: var(--pergamena);
    background:
      radial-gradient(ellipse at 50% 0%, rgba(42,29,61,0.65) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 100%, rgba(58,36,16,0.6) 0%, transparent 55%),
      url('immagini/decorazioni/sfondo-tavolo.webp') center / cover no-repeat,
      var(--notte);
    padding: max(14px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    user-select: none;
  }

  .barra { width: 100%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .torna { font-size: 2.55rem; color: var(--tenue); text-decoration: none; display: inline-flex; align-items: center; gap: 10px; }
  .torna .icona-torna { width: 60px; height: 60px; object-fit: contain; }
  .torna:hover { color: var(--oro); }
  .borsellino {
    display: flex; align-items: center; gap: 7px; padding: 6px 13px 6px 7px; border-radius: 999px;
    border: 1px solid var(--oro-scuro); text-decoration: none; color: inherit;
    background: linear-gradient(168deg, rgba(74,53,32,0.9), rgba(24,17,10,0.95));
  }
  .borsellino .cifra { font-size: 0.98rem; font-weight: 800; color: var(--oro-chiaro); font-variant-numeric: tabular-nums; }
  .borsellino .etichetta-moneta { font-size: 0.58rem; letter-spacing: 1px; text-transform: uppercase; color: var(--tenue); font-weight: 600; }

  .insegna { text-align: center; }
  .insegna h1 {
    margin: 0; font-family: Georgia, serif; font-size: clamp(1.5rem, 4.2vw, 2.3rem);
    letter-spacing: 3px; font-weight: 700;
    background: linear-gradient(180deg, #fff6d8, var(--oro) 45%, var(--oro-scuro) 75%, #ffe9ae);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 0 rgba(0,0,0,0.7));
  }
  .insegna .sotto { font-size: 0.82rem; color: var(--tenue); margin-top: 5px; letter-spacing: 0.6px; }

  /* ---------- quanto manca ---------- */
  .avanzamento {
    width: 100%; max-width: 1000px; padding: 14px 16px; border-radius: 14px;
    border: 1px solid var(--oro-scuro);
    background: linear-gradient(168deg, rgba(52,38,22,0.9), rgba(22,15,9,0.95));
    display: flex; flex-direction: column; gap: 10px;
  }
  .avanzamento .riga { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .avanzamento .quanto { font-family: Georgia, serif; font-size: 1.4rem; color: var(--oro-chiaro); }
  .avanzamento .quanto b { font-size: 1.9rem; }
  .avanzamento .commento { font-size: 0.8rem; color: var(--tenue); }
  .sbarra { height: 9px; border-radius: 99px; background: rgba(0,0,0,0.45); overflow: hidden; }
  .sbarra i {
    display: block; height: 100%; border-radius: 99px; width: 0;
    background: linear-gradient(90deg, var(--oro-scuro), var(--oro) 60%, #fff3cc);
    transition: width 0.9s cubic-bezier(.2,.9,.3,1);
  }
  .per-rarita { display: flex; gap: 8px; flex-wrap: wrap; }
  .per-rarita span {
    font-size: 0.72rem; padding: 3px 10px; border-radius: 9px;
    background: rgba(255,255,255,0.05); border: 1px solid transparent;
  }
  .per-rarita span.completa { border-color: var(--verde); color: #b6ffd4; }

  /* ---------- filtri ---------- */
  .filtri { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .filtro {
    padding: 7px 15px; border-radius: 99px; cursor: pointer; font-family: inherit;
    font-size: 0.8rem; font-weight: 700; letter-spacing: 0.4px;
    border: 1px solid var(--oro-scuro); background: rgba(0,0,0,0.35); color: var(--tenue);
    transition: color 0.14s, border-color 0.14s, background 0.14s;
  }
  .filtro:hover { color: var(--pergamena); }
  .filtro.scelto { background: linear-gradient(180deg, #fff0c2, var(--oro)); color: #2a1c08; border-color: var(--oro-chiaro); }

  /* ---------- le pagine dell'album ---------- */
  /* IL CONTENITORE DEVE AVERE UNA LARGHEZZA.
     Il body è una colonna flessibile centrata: i suoi figli, se non
     dicono quanto sono larghi, si stringono sul contenuto. #sezioni non
     lo diceva, così la griglia dentro non aveva spazio da spartire e
     incolonnava tutte le figurine una sotto l'altra. Le altre fasce
     della pagina non davano problemi solo perché la larghezza ce
     l'avevano già. */
  #sezioni { width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 6px; }
  .sezione { width: 100%; display: flex; flex-direction: column; gap: 11px; }
  .titolo-sezione {
    display: flex; align-items: center; gap: 12px; margin-top: 8px;
    font-family: Georgia, serif; font-size: 1rem; letter-spacing: 2.4px;
    text-transform: uppercase; color: var(--oro);
  }
  .titolo-sezione::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(232,196,106,0.45), transparent); }
  .titolo-sezione .conteggio {
    font-family: 'Segoe UI', system-ui, sans-serif; font-size: 0.75rem;
    letter-spacing: 0.4px; text-transform: none; color: var(--tenue); flex: 0 0 auto;
  }

  /* Tante per riga, quante ce ne stanno. Niente min() qui dentro: la
     misura minima resta una lunghezza secca, così la riga non può
     essere scartata da nessun browser e ritrovarsi a colonna sola. */
  .griglia {
    display: grid; gap: 13px 11px;
    grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
    align-items: start;
  }
  @media (min-width: 700px) { .griglia { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); } }

  /* La figurina. Quella che hai è a colori e ha il numero di copie;
     quella che manca resta al suo posto, spenta, col nome coperto. */
  /* La figurina e' solo il PORTAFOTO: la carta vera (cornice, arte,
     nome, numeri) la disegna .carta-illustrata, che e' la stessa in
     tutte le pagine. Qui restano le cose che valgono solo nell'album:
     l'inclinazione da album, il sollevarsi al passaggio, i bollini
     "nuova" e "xN". Il bordo colorato per rarita' non c'e' piu' — con
     la cornice sopra non si vedrebbe — e al suo posto c'e' l'alone,
     che si accende quando la carta si solleva. */
  .figurina {
    position: relative; aspect-ratio: 0.71; border-radius: 9px; overflow: hidden; cursor: pointer;
    transition: transform 0.16s cubic-bezier(.2,.9,.3,1), box-shadow 0.16s;
  }
  .figurina .carta-illustrata { border-radius: 9px; }
  /* Un album di figurine non è una tabella: le figurine si attaccano a
     mano e stanno un po' storte, ognuna a modo suo. L'inclinazione è
     minima (meno di due gradi) e sempre la stessa per la stessa carta,
     così la pagina non balla a ogni ridisegno. */
  .figurina { transform: rotate(var(--storta, 0deg)) translateY(var(--sbalzo, 0px)); }
  .figurina:hover {
    transform: rotate(0deg) translateY(-5px) scale(1.04);
    box-shadow: 0 10px 24px rgba(0,0,0,0.65), 0 0 20px var(--alone, transparent);
    z-index: 2;
  }

  .figurina .copie {
    position: absolute; top: 6px; right: 6px; font-size: 0.64rem; font-weight: 900;
    padding: 2px 7px; border-radius: 9px; background: rgba(0,0,0,0.62);
    border: 1px solid var(--bordo, var(--r1)); color: var(--oro-chiaro);
  }
  .figurina .nuova {
    position: absolute; top: 6px; left: 6px; font-size: 0.58rem; font-weight: 900;
    letter-spacing: 1px; padding: 2px 7px; border-radius: 9px;
    background: linear-gradient(180deg, #9dffc4, var(--verde)); color: #05301a;
  }

  /* quello che manca resta al suo posto, ma spento: e' il buco
     nell'album, e si deve vedere che e' un buco (lo spegnimento vero
     lo fa .carta-illustrata.manca, qui si toglie solo la reazione al
     passaggio: non c'e' niente da guardare piu' da vicino) */
  .figurina.manca { opacity: 0.72; }
  .figurina.manca:hover { transform: rotate(var(--storta, 0deg)) translateY(var(--sbalzo, 0px)); box-shadow: none; }

  /* ---------- la carta ingrandita ---------- */
  .lente {
    position: fixed; inset: 0; z-index: 40; display: none;
    align-items: center; justify-content: center; padding: 22px;
    background: rgba(6,4,10,0.84); backdrop-filter: blur(5px);
  }
  .lente.viva { display: flex; animation: entraLente 0.25s ease-out; }
  @keyframes entraLente { from { opacity: 0; } to { opacity: 1; } }
  /* Ingrandita, la carta si legge tutta: nome, stelle, numeri e testo
     dell'abilita' stanno gia' dentro la cornice. Qui intorno resta solo
     quello che la cornice non dice — quante copie ne hai, e per le
     carte che ti mancano dove trovarle. */
  .lente .grande {
    width: min(330px, 86vw);
    display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;
    animation: arrivaLente 0.4s cubic-bezier(.2,1.3,.4,1) both;
  }
  .lente .carta-illustrata {
    width: 100%; border-radius: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 60px var(--alone, transparent);
  }
  @keyframes arrivaLente { 0% { transform: scale(0.7) rotateY(-18deg); opacity: 0; } 100% { transform: scale(1) rotateY(0); opacity: 1; } }
  .lente .quante { font-size: 0.82rem; color: var(--verde); }
  .lente .dove-si-trova { font-size: 0.78rem; color: var(--tenue); line-height: 1.5; max-width: 92%; }

  .vuoto {
    font-size: 0.85rem; color: var(--tenue); text-align: center; padding: 12px 0 30px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .vuoto .fregio { width: 70px; height: auto; opacity: 0.55; }
  .nota { max-width: 640px; font-size: 0.72rem; color: #8a7e68; line-height: 1.55; text-align: center; }

  /* ---------- LA CARTA ILLUSTRATA (condivisa fra le pagine) ---------- */
  .carta-illustrata {
    position: relative; aspect-ratio: 0.71; overflow: hidden;
    container-type: inline-size;
    /* Lo sfondo si vede DENTRO la finestra, dietro l'illustrazione:
       le illustrazioni hanno lo sfondo trasparente, quindi il colore
       della carta traspare intorno al personaggio ed e' quello che le
       fa sembrare disegnate dentro la cornice invece che incollate. */
    background:
      radial-gradient(ellipse at 50% 30%, var(--velo, rgba(255,255,255,0.10)), transparent 62%),
      linear-gradient(168deg, #2a2140 0%, #1a1428 60%, #120d1c 100%);
    --fin-x: 15.16%; --fin-y: 13.57%; --fin-w: 69.91%; --fin-h: 51.73%;
    --nome-x: 17.36%; --nome-y: 4.52%; --nome-w: 64.24%; --nome-h: 7.81%;
    --desc-x: 14.47%; --desc-y: 67.84%; --desc-w: 70.02%; --desc-h: 10.28%;
    --statsx-x: 14.47%; --statdx-x: 50.93%; --stat-y: 81.83%;
    --statsx-w: 31.25%; --statdx-w: 33.56%; --stat-h: 8.22%;
  }
  /* La cornice delle Carte Magiche ha proporzioni sue: finestra un
     filo piu' bassa e UN SOLO riquadro in basso, piu' alto (niente
     vita/attacco da scrivere, solo l'effetto). */
  .carta-illustrata.magica {
    --fin-y: 13.31%; --fin-h: 52.44%;
    --nome-x: 19.68%; --nome-y: 4.87%; --nome-w: 61.34%; --nome-h: 7.71%;
    --desc-x: 15.63%; --desc-y: 68.18%; --desc-w: 69.44%; --desc-h: 21.10%;
  }

  .ci-finestra {
    position: absolute; overflow: hidden;
    left: var(--fin-x); top: var(--fin-y); width: var(--fin-w); height: var(--fin-h);
  }
  /* "a coprire": l'illustrazione riempie tutta la finestra e quello che
     avanza si taglia, invece di lasciare bordi vuoti ai lati. */
  .ci-arte { width: 100%; height: 100%; object-fit: cover; display: block; }

  .ci-cornice {
    position: absolute; inset: 0; width: 100%; height: 100%;
    display: block; pointer-events: none;
  }

  /* --- i testi, ognuno nel suo spazio vuoto della cornice --- */
  .ci-testata, .ci-desc, .ci-stat {
    position: absolute; display: flex; align-items: center; justify-content: center;
    text-align: center; overflow: hidden; pointer-events: none;
  }
  .ci-testata {
    left: var(--nome-x); top: var(--nome-y); width: var(--nome-w); height: var(--nome-h);
    flex-direction: column; gap: 0;
  }
  .ci-nome {
    font-family: Georgia, 'Times New Roman', serif; font-weight: 700;
    color: #f0e2c0; line-height: 1.05;
    font-size: 11px; font-size: 6.2cqw;
    text-shadow: 0 1px 2px #000; letter-spacing: 0.2px;
    max-width: 96%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ci-stelle { color: #e2b43c; line-height: 1; font-size: 7px; font-size: 3.6cqw; }
  .ci-seme { color: #c41e28; font-size: 8px; font-size: 4.6cqw; line-height: 1; }
  .ci-seme.nero { color: #2a2830; }

  .ci-desc {
    left: var(--desc-x); top: var(--desc-y); width: var(--desc-w); height: var(--desc-h);
    padding: 0 3%;
    font-family: Georgia, 'Times New Roman', serif; color: #2a2118;
    font-size: 7px; font-size: 3.5cqw; line-height: 1.25;
  }
  /* SULLA CORNICE MAGICA il riquadro non e' pergamena ma metallo scuro,
     quindi il testo va chiaro. Era pero' un grigio-lilla tenue su un
     grigio medio: sulla carta si leggeva a fatica, grigio su grigio.
     Adesso e' un bianco caldo pieno, con un'ombra netta sotto che lo
     stacca dal fondo — la stessa che porta il nome nella barra in cima.
     E il corpo cresce un po': quel riquadro e' il doppio piu' alto di
     quello dei personaggi, il testo ci sta comodo. */
  .carta-illustrata.magica .ci-desc {
    color: #f6efdc; font-size: 8px; font-size: 3.9cqw;
    text-shadow: 0 1px 2px rgba(0,0,0,0.9);
  }

  /* TUTTE LE CLASSI QUI DENTRO COMINCIANO PER "ci-", e non e' pignoleria:
     questo pezzo viene incollato dentro pagine che hanno un CSS loro, e
     un nome comune si scontra. E' successo davvero: "etichetta" e'
     anche il bollino NUOVA/DOPPIONE dell'apertura pacchetti, che e'
     position:absolute — l'etichetta VITA se lo prendeva e finiva
     sopra al proprio numero. Con il prefisso non puo' piu' capitare. */
  /* VITA / ATT: l'etichetta SOPRA, il numero SOTTO, e devono restare
     due righe separate. Prima l'altezza del riquadro era fissata al
     riquadro della cornice e il contenuto, se cresceva, ci finiva
     dentro a forza: l'etichetta e il numero si accavallavano.
     Adesso l'altezza e' un MINIMO, non una gabbia — il riquadro parte
     dal punto giusto e si prende quello che gli serve — e le due righe
     hanno un'interlinea dichiarata, cosi' non si toccano mai. */
  .ci-stat {
    top: var(--stat-y); min-height: var(--stat-h); height: auto;
    flex-direction: column; justify-content: center; gap: 0.6cqw; line-height: 1;
  }
  .ci-stat.sx { left: var(--statsx-x); width: var(--statsx-w); }
  .ci-stat.dx { left: var(--statdx-x); width: var(--statdx-w); }
  .ci-stat .ci-et {
    color: #cfc3a6; font-size: 5px; font-size: 2.5cqw;
    letter-spacing: 0.5px; line-height: 1.1; display: block;
  }
  .ci-stat .ci-num {
    font-family: Georgia, serif; font-weight: 800; color: #f7ecd2;
    font-size: 10px; font-size: 5.2cqw; line-height: 1.1;
    text-shadow: 0 1px 2px #000; display: block;
  }

  /* SULLE CARTE PICCOLE il testo minuto non si legge: si toglie invece
     di lasciarlo li' come sporco. Il nome resta — e' quello che serve a
     riconoscere la carta — e i numeri si vedono ingrandendola. */
  @container (max-width: 165px) {
    .ci-desc, .ci-stat { display: none; }
  }

  /* la carta che non si possiede: sagoma spenta */
  .carta-illustrata.manca .ci-arte { filter: grayscale(1) brightness(0.28); }
  .carta-illustrata.manca .ci-cornice { filter: grayscale(0.85) brightness(0.55); }
  .carta-illustrata.manca .ci-nome { color: rgba(255,255,255,0.34); }

  /* SENZA ILLUSTRAZIONE.
     I personaggi segnaposto (001-008) e le carte di esempio sono nati
     prima delle illustrazioni e non ne hanno una: sono la dotazione di
     benvenuto, fuori commercio, destinati a sparire. Mettere il tag
     dell'immagine lo stesso vorrebbe dire l'icona di immagine rotta —
     il modo peggiore di dire "questa carta non ha un disegno". Al suo
     posto il seme, grande, nella finestra: si capisce che e' una carta
     senza figura, non una figura che non si e' caricata. */
  .ci-senza-arte {
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    font-size: 34px; font-size: 30cqw; line-height: 1;
    color: rgba(255,255,255,0.13); text-shadow: 0 0 6cqw currentColor;
  }

</style>
</head>
<body>

<div class="barra">
  <a class="torna" href="home.html"><img src="immagini/decorazioni/torna-home.webp" alt="" class="icona-torna">Torna alla home</a>
  <a class="borsellino" href="negozio.html" title="I tuoi sharkini">
    <span id="moneta"></span><span class="cifra" id="saldo">0</span><span class="etichetta-moneta">sharkini</span>
  </a>
</div>

<div class="insegna">
  <h1>ALBUM</h1>
  <div class="sotto">Tutte le carte del gioco, e quelle che ti mancano</div>
</div>

<div class="avanzamento">
  <div class="riga">
    <span class="quanto"><b id="quante">0</b> <span id="suQuante">su 0</span></span>
    <span class="commento" id="commento"></span>
  </div>
  <div class="sbarra"><i id="sbarra"></i></div>
  <div class="per-rarita" id="perRarita"></div>
</div>

<div class="filtri" id="filtri"></div>

<div id="sezioni"></div>

<div class="nota">
  Le carte doppie non si buttano: serviranno a potenziare quelle che hai già.
  Per ora restano contate qui, in attesa di quella parte del gioco.
</div>

<div class="lente" id="lente"><div class="grande" id="grande"></div></div>

<script>
(function () {
"use strict";

const __SHA = (function(){
// ============================================================
// BURRACO LEGENDS — GLI SHARKINI
//
// Nel gioco c'è UNA SOLA moneta: lo sharkino. Le carte si comprano
// solo con gli sharkini, mai direttamente con i soldi. I soldi veri
// servono unicamente a ricaricare sharkini. Due passaggi, non uno:
//
//     euro  →  sharkini  →  pacchetti di carte
//
// Il motivo non è estetico. Gli sharkini si guadagnano anche entrando
// ogni giorno: se le carte avessero un prezzo in euro accanto a quello
// in sharkini, il premio giornaliero diventerebbe un listino, e il
// giocatore che non spende si sentirebbe ricordare ogni volta quanto
// vale il tempo che ha regalato al gioco. Con una moneta sola, chi
// gioca e chi paga arrivano allo stesso posto per strade diverse.
//
// IL PREMIO DI OGNI GIORNO
// Primo giorno 100, poi 100 in più ogni giorno fino a 700 al settimo.
// Da lì in poi resta 700, all'infinito, FINCHÉ non si salta un giorno:
// chi salta ricomincia da 100. Non si perdono gli sharkini già presi,
// si perde la scala.
//
// IL CAMBIO
// Un mese intero di accessi consecutivi = un pacchetto da 5 carte.
// È il paletto deciso col committente e da lì scendono tutti i prezzi.
// Verificato dal test, non a occhio.
//
// NUMERI ANCORA PROVVISORI, da tarare col playtest:
//   - la scala del premio giornaliero
//   - il cambio euro → sharkini
//   - i prezzi dei pacchetti
// ============================================================

// ------------------------------------------------------------
// 1. IL PREMIO GIORNALIERO
// ------------------------------------------------------------
const PREMI_SETTIMANA = [100, 200, 300, 400, 500, 600, 700];
const PREMIO_MASSIMO = PREMI_SETTIMANA[PREMI_SETTIMANA.length - 1];

// Quanto vale il giorno numero N della serie (N parte da 1).
function premioDelGiorno(giorno) {
  if (giorno < 1) return 0;
  return giorno <= PREMI_SETTIMANA.length ? PREMI_SETTIMANA[giorno - 1] : PREMIO_MASSIMO;
}

// Quanto raccoglie in tutto chi entra N giorni di fila senza saltarne uno.
function guadagnoInGiorni(giorni) {
  let somma = 0;
  for (let g = 1; g <= giorni; g++) somma += premioDelGiorno(g);
  return somma;
}

// ------------------------------------------------------------
// LE DATE
// Confronto i giorni di calendario, non i millisecondi: chi entra alle
// 23:50 e poi alle 00:10 ha fatto due giorni, chi entra alle 09:00 e
// alle 21:00 ne ha fatto uno solo. Uso la data locale del giocatore,
// che è quella che lui vede sul telefono.
// ------------------------------------------------------------
function giornoDiCalendario(quando) {
  const d = new Date(quando);

             serieRotta: false, giaRitiratoOggi: false };
  }
  const distanza = oggi - ultimo;

  if (distanza <= 0) {                       // già passato di qui oggi
    return { puoRitirare: false, giorno: serie.giorno, premio: premioDelGiorno(serie.giorno),
             serieRotta: false, giaRitiratoOggi: true };
  }
  if (distanza === 1) {                      // la serie regge
    const g = serie.giorno + 1;
    return { puoRitirare: true, giorno: g, premio: premioDelGiorno(g),
             serieRotta: false, giaRitiratoOggi: false };
  }
  return { puoRitirare: true, giorno: 1, premio: premioDelGiorno(1),   // saltato: si ricomincia

// Il seme si colora come sulla carta vera: rossi cuori e quadri.
const SEMI_ROSSI = ['♥', '♦'];

// Le carte magiche non hanno seme: il loro tipo si legge dall'id.
function eMagica(carta) {
  return !carta.seme;
}

function immagineCarta(idCarta) {
  return 'immagini/' + idCarta + '.webp';
}

// La carta illustrata: cornice, finestra con l'arte, testi al loro posto.
// `opzioni.posseduta` a false la spegne (sagoma di quello che manca).
function cartaIllustrata(carta, testi, opzioni) {
  const o = opzioni || {};
  const magica = eMagica(carta);
  const cornice = magica ? 'cornice-magica' : 'cornice-personaggio';
  const posseduta = o.posseduta !== false;
  const stelle = o.stelle || '';

  const seme = carta.seme
    ? '<span class="ci-seme' + (SEMI_ROSSI.includes(carta.seme) ? '' : ' nero') + '">' + carta.seme + '</span>'
    : '';

  // Il nome e le stelle stanno nella barra in cima; il seme accanto al nome.
  const testata =
    '<div class="ci-testata">' +
      '<div class="ci-nome">' + (posseduta ? testi.nome : '? ? ?') + (seme ? ' ' + seme : '') + '</div>' +
      (stelle ? '<div class="ci-stelle">' + stelle + '</div>' : '') +
    '</div>';

  // I numeri solo per i personaggi: una Carta Magica non ha vita ne' attacco.
  const numeri = (!magica && posseduta)
    ? '<div class="ci-stat sx"><span class="ci-et">VITA</span><span class="ci-num">' + carta.vita + '</span></div>' +
      '<div class="ci-stat dx"><span class="ci-et">ATT</span><span class="ci-num">' + carta.att + '</span></div>'
    : '';

  const descrizione = (posseduta && testi.descrizione)
    ? '<div class="ci-desc">' + testi.descrizione + '</div>' : '';

  // Non tutte le carte hanno un'illustrazione: l'elenco di quelle che ce
  // l'hanno lo scrive il generatore leggendo la cartella vera, cosi' non
  // si puo' sbagliare (vedi dati_illustrazioni in carta_illustrata.py).
  // loading="lazy": l'album puo' avere decine di carte, e scaricarle
  // tutte insieme all'apertura vorrebbe dire aspettare per vedere le
  // prime. Cosi' arrivano quelle che si guardano.
  const haArte = typeof ILLUSTRAZIONI !== 'undefined' && ILLUSTRAZIONI.indexOf(carta.id) !== -1;
  const dentroFinestra = haArte
    ? '<img class="ci-arte" src="' + immagineCarta(carta.id) + '" alt="" loading="lazy" draggable="false">'
    : '<div class="ci-senza-arte">' + (carta.seme || (carta.tipo === 'trappola' ? '⚡' : '✦')) + '</div>';

  return '<div class="carta-illustrata' + (magica ? ' magica' : '') +
           (posseduta ? '' : ' manca') + '">' +
      '<div class="ci-finestra">' + dentroFinestra + '</div>' +
      '<img class="ci-cornice" src="' + immagineCarta(cornice) + '" alt="" loading="lazy" draggable="false">' +
      testata + numeri + descrizione +
    '</div>';
}

// ============================================================
// IL PONTE
//
// Sharkini, album e pacchetti adesso stanno sul server. Il browser
// chiede e mostra: non decide più niente, e soprattutto non può più
// mentire — prima bastava aprire gli strumenti di sviluppo per darsi
// un milione di sharkini e tutte le carte rare.
//
// MA LE PAGINE DEVONO APRIRSI ANCHE COL DOPPIO CLIC.
// Serve per provarle in fretta, senza avviare niente. Allora ci sono
// due ponti con le stesse identiche funzioni: uno parla col server,
// l'altro si arrangia col browser. Chi li usa non sa quale dei due ha
// davanti — e questo tiene il resto del codice pulito da "se c'è il
// server allora... altrimenti...".
//
// La regola per scegliere è semplice e non mente: se la pagina è
// arrivata da un server, si parla col server. Se è stata aperta da un
// file, non c'è nessun server con cui parlare.
// ============================================================
const CI_SONO_ARRIVATO_DAL_SERVER = location.protocol === 'http:' || location.protocol === 'https:';

function creaPonteServer() {
  const CHIAVE_GETTONE = 'bb_gettone';
  let gettone = null;
  try { gettone = localStorage.getItem(CHIAVE_GETTONE); } catch (e) {}

  async function chiedi(via, corpo) {
    const risposta = await fetch(via, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...corpo, gettone })
    });
    return risposta.json();
  }

  return {
    dove: 'server',
    async io(nome) {
      const r = await chiedi('/api/io', { nome });
      if (r.gettone) {
        gettone = r.gettone;
        // Il gettone è l'unica cosa che il browser deve custodire: è
        // la chiave di casa. Perderlo vuol dire ripartire da zero,
        // finché non ci saranno gli account veri.
        try { localStorage.setItem(CHIAVE_GETTONE, gettone); } catch (e) {}
      }
      return r;
    },
    ritiraPremio: () => chiedi('/api/premio', {}),
    compra: (carte, tipo) => chiedi('/api/compra', { carte, tipo }),
    ricarica: (offerta) => chiedi('/api/ricarica', { offerta })
  };
}

// ------------------------------------------------------------
// IL PONTE DI RIPIEGO
// Quando la pagina è aperta col doppio clic non c'è nessun server: si
// fa tutto qui, come prima. È chiaramente falsificabile, e va bene —
// serve solo a guardare le pagine, non a giocare sul serio. Perché
// resti chiaro, ogni risposta porta `diProva: true` e le pagine lo
// dicono a chi guarda.
// ------------------------------------------------------------
function creaPonteBrowser() {
  const leggi = (c, d) => { try { const v = localStorage.getItem(c); return v === null ? d : JSON.parse(v); } catch (e) { return d; } };
  const scrivi = (c, v) => { try { localStorage.setItem(c, JSON.stringify(v)); } catch (e) {} };

  function statoAttuale() {
    const serie = Object.assign({}, SERIE_NUOVA, leggi('bb_sharkini', {}));
    const collezione = leggi('bb_collezione', {});
    const contatorePity = leggi('bb_pity', 0);
    const s = statoSerie(serie, Date.now());
    return {
      ok: true, diProva: true, serie, collezione, contatorePity,
      saldo: serie.saldo,
      carteDiverse: Object.keys(collezione).length,
      carteInTutto: Object.values(collezione).reduce((a, b) => a + b, 0),
      alleCarteAllaGaranzia: Math.max(0, SOGLIA_PITY - contatorePity),
      premio: {
        puoRitirare: s.puoRitirare, giorno: s.giorno, quanto: s.premio,
        serieRotta: s.serieRotta, giaRitiratoOggi: s.giaRitiratoOggi
      }
    };
  }

  return {
    dove: 'browser',
    async io() { return statoAttuale(); },
    async ritiraPremio() {
      const st = statoAttuale();
      const esito = ritiraPremio(st.serie, Date.now());
      if (esito.guadagno === 0) return { ok: false, diProva: true, motivo: 'Già ritirato oggi.', ...statoAttuale() };
      scrivi('bb_sharkini', esito.serie);
      return { ok: true, diProva: true, guadagno: esito.guadagno,
               serieRotta: esito.stato.serieRotta, ...statoAttuale() };
    },
    async compra(carte, tipo) {
      const st = statoAttuale();
      const offerta = offertaPerCarte(Number(carte), tipo);
      if (!offerta) return { ok: false, diProva: true, motivo: 'Quel pacchetto non esiste.' };
      if (st.serie.saldo < offerta.costo) {
        return { ok: false, diProva: true, motivo: 'Sharkini insufficienti.',
                 manca: offerta.costo - st.serie.saldo, costo: offerta.costo, saldo: st.serie.saldo };
      }
      // Anche qui, come sul server: dai pacchetti esce solo quello che
      // è davvero in vendita, i segnaposto della dotazione di benvenuto
      // restano fuori (vedi carteInVendita in engine/pacchetti.js).
      let bacino;
      try { bacino = carteDiTipo(carteInVendita(CATALOGO), tipo); }
      catch (e) { return { ok: false, diProva: true, motivo: e.message }; }
      if (!bacino.length) return { ok: false, diProva: true, motivo: 'Nessuna carta di quel tipo è ancora in vendita.' };
      const r = apriPacchetto(bacino, st.collezione, st.contatorePity, Math.random, offerta.carte);
      const collezione = { ...st.collezione };
      for (const c of r.carte) collezione[c.carta.id] = (collezione[c.carta.id] || 0) + 1;
      scrivi('bb_sharkini', { ...st.serie, saldo: st.serie.saldo - offerta.costo });
      scrivi('bb_collezione', collezione);
      scrivi('bb_pity', r.contatore);
      return { ok: true, diProva: true, costo: offerta.costo, carte: r.carte,
               pityScattato: r.pityScattato, ...statoAttuale() };
    },
    async ricarica(idOfferta) {
      const st = statoAttuale();
      const r = RICARICHE.find((x) => x.id === idOfferta);
      if (!r) return { ok: false, diProva: true, motivo: 'Quella ricarica non esiste.' };
      scrivi('bb_sharkini', { ...st.serie, saldo: st.serie.saldo + r.sharkini });
      return { ok: true, diProva: true, accreditati: r.sharkini, ...statoAttuale() };
    }
  };
}

const SCORTA = CI_SONO_ARRIVATO_DAL_SERVER ? creaPonteServer() : creaPonteBrowser();

// LE SEZIONI DELL'ALBUM
// Diviso per tipo, e dentro ogni tipo per rarità crescente: la pagina
// finisce con le carte più rare, che sono quelle che si guardano.

const SEZIONI = [
  { id: 'personaggio', titolo: 'Eroi' },
  { id: 'sorpresa',    titolo: 'Sorprese' },
  { id: 'trappola',    titolo: 'Trappole' }
];

const ordinate = CATALOGO.slice().sort((a, b) =>
  (a.rarita || 1) - (b.rarita || 1) || String(a.id).localeCompare(String(b.id)));

const quante = (c) => posseduto[c.id] || 0;
const ho = (c) => quante(c) > 0;

// ------------------------------------------------------------
function figurina(c) {
  const r = c.rarita || 1;
  const st = STILE[r] || STILE[1];
  const t = testo(c.id);
  const n = quante(c);
  // Due numeretti ricavati dal nome della carta: sempre gli stessi per
  // la stessa carta, ma molto diversi fra una carta e l'altra.
  // Il primo tentativo sommava i caratteri, e con nomi consecutivi
  // (personaggio_001, _002, _003...) usciva una scaletta di angoli quasi
  // uguali: le figurine sembravano allineate col righello. Serve un
  // mescolamento vero, che da nomi vicini tiri fuori numeri lontani.
  let h = 2166136261;
  for (let i = 0; i < c.id.length; i++) {
    h ^= c.id.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  h = h >>> 0;
  const storta = ((h % 1000) / 999 * 3.6 - 1.8).toFixed(2);        // fra -1,8° e +1,8°
  const sbalzo = (((h >>> 11) % 1000) / 999 * 7 - 3.5).toFixed(1); // qualche pixel su o giù

  const stile = 'style="--bordo:' + st.colore + ';--velo:' + st.velo + ';--alone:' + st.alone +
                ';--storta:' + storta + 'deg;--sbalzo:' + sbalzo + 'px"';

  // La carta la disegna il pezzo condiviso; qui intorno restano solo i
  // bollini dell'album. Nella griglia la descrizione non entra (il CSS
  // la nasconde sotto una certa larghezza), quindi non la si passa
  // nemmeno: sarebbero byte scritti per niente in ognuna delle carte.
  const dentro = cartaIllustrata(c, { nome: t.nome }, { posseduta: !!n, stelle: stelle(r) });

  if (!n) {
    return '<div class="figurina manca" ' + stile + ' data-id="' + c.id + '">' + dentro + '</div>';
  }
  return '<div class="figurina" ' + stile + ' data-id="' + c.id + '">' + dentro +
    (viste[c.id] ? '' : '<span class="nuova">nuova</span>') +
    (n > 1 ? '<span class="copie">×' + n + '</span>' : '') +
  '</div>';
}

function disegna() {
  let html = '';
  for (const sez of SEZIONI) {
    const dentro = ordinate.filter((c) => tipoDi(c) === sez.id);
    if (!dentro.length) continue;
    const mostrate = dentro.filter((c) =>
      filtro === 'tutte' || (filtro === 'mie' && ho(c)) || (filtro === 'mancanti' && !ho(c)) ||
      (filtro === 'doppie' && quante(c) > 1));
    if (!mostrate.length) continue;
    const avute = dentro.filter(ho).length;
    html += '<div class="sezione">' +
      '<div class="titolo-sezione">' + sez.titolo +
        '<span class="conteggio">' + avute + ' su ' + dentro.length + '</span></div>' +
      '<div class="griglia">' + mostrate.map(figurina).join('') + '</div>' +
    '</div>';
  }
  $('sezioni').innerHTML = html || '<div class="vuoto"><img class="fregio" src="immagini/decorazioni/fregio.webp" alt="">Qui non c\'è niente da mostrare con questo filtro.</div>';

  for (const nodo of document.querySelectorAll('.figurina')) {
    nodo.addEventListener('click', () => ingrandisci(nodo.getAttribute('data-id')));
  }
}

// ------------------------------------------------------------
// L'AVANZAMENTO
// ------------------------------------------------------------
function aggiornaAvanzamento() {
  const totale = CATALOGO.length;
  const avute = CATALOGO.filter(ho).length;
  $('quante').textContent = avute;
  $('suQuante').textContent = 'su ' + totale;
  $('sbarra').style.width = (totale ? (avute / totale) * 100 : 0).toFixed(1) + '%';

  const mancano = totale - avute;
  $('commento').textContent = mancano === 0
    ? 'Album completo. Non manca più niente.'
    : (mancano === 1 ? 'Ti manca una carta sola.' : 'Ti mancano ' + mancano + ' carte.');

  const perRarita = [1, 2, 3, 4, 5].map((r) => {
    const gruppo = CATALOGO.filter((c) => (c.rarita || 1) === r);
    if (!gruppo.length) return '';
    const a = gruppo.filter(ho).length;
    return '<span class="' + (a === gruppo.length ? 'completa' : '') + '" style="color:' +
      (a === gruppo.length ? '' : STILE[r].colore) + '">' + stelle(r).slice(0, r) + ' ' + a + '/' + gruppo.length + '</span>';
  }).join('');
  $('perRarita').innerHTML = perRarita;
}

// ------------------------------------------------------------
// LA CARTA INGRANDITA
// ------------------------------------------------------------
function ingrandisci(id) {
  const c = CATALOGO.find((x) => x.id === id);
  if (!c) return;
  const n = quante(c);
  const r = c.rarita || 1;
  const st = STILE[r] || STILE[1];
  const t = testo(c.id);

  // guardarla la smette di essere "nuova"
  if (n && !viste[id]) {
    viste[id] = true;
    try { localStorage.setItem('bb_album_viste', JSON.stringify(viste)); } catch (e) {}
  }

  $('grande').setAttribute('style',
    '--bordo:' + (n ? st.colore : 'rgba(255,255,255,0.2)') +
    ';--velo:' + (n ? st.velo : 'transparent') +
    ';--alone:' + (n ? st.alone : 'transparent'));

  // Ingrandita la carta ci sta tutta: qui si passa anche la descrizione,
  // che nella griglia piccola sarebbe stata illeggibile.
  const carta = cartaIllustrata(c, t, { posseduta: !!n, stelle: stelle(r) });

  $('grande').innerHTML = carta + (n
    ? '<div class="quante">' + (n > 1 ? 'Ne hai ' + n + ' copie' : 'La tua unica copia') + '</div>'
    : '<div class="dove-si-trova">Questa carta non ce l\'hai ancora. Si trova nei pacchetti: ' +
      'a ' + stelle(r).slice(0, r) + ' esce nel ' + (PROBABILITA[r] || 0).toString().replace('.', ',') + '% dei casi.</div>');

  $('lente').classList.add('viva');
  disegna();
  aggiornaAvanzamento();
}

$('lente').addEventListener('click', () => $('lente').classList.remove('viva'));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('lente').classList.remove('viva'); });

// ------------------------------------------------------------
// I FILTRI
// ------------------------------------------------------------
const FILTRI = [
  { id: 'tutte', nome: 'Tutte' },
  { id: 'mie', nome: 'Che ho' },
  { id: 'mancanti', nome: 'Che mi mancano' },
  { id: 'doppie', nome: 'Doppie' }
];
function disegnaFiltri() {
  $('filtri').innerHTML = FILTRI.map((f) => {
    const quanti = f.id === 'tutte' ? CATALOGO.length
      : f.id === 'mie' ? CATALOGO.filter(ho).length
      : f.id === 'mancanti' ? CATALOGO.filter((c) => !ho(c)).length
      : CATALOGO.filter((c) => quante(c) > 1).length;
    return '<button class="filtro' + (filtro === f.id ? ' scelto' : '') + '" data-f="' + f.id + '">' +
      f.nome + ' (' + quanti + ')</button>';
  }).join('');
  for (const b of document.querySelectorAll('.filtro')) {
    b.addEventListener('click', () => { filtro = b.getAttribute('data-f'); disegnaFiltri(); disegna(); });
  }
}

(async function avvia() {
  const r = await SCORTA.io();
  if (r && r.ok) { posseduto = r.collezione || {}; saldo = r.saldo || 0; }
  $('saldo').textContent = formattaSharkini(saldo);
  disegnaFiltri();
  disegna();
  aggiornaAvanzamento();
  avvisaSeDiProva();
})();

window.__prova = {
  posseduto: () => posseduto, filtro: () => filtro, dove: () => SCORTA.dove,
  imposta: (p) => {
    posseduto = { ...p };
    disegnaFiltri(); disegna(); aggiornaAvanzamento();
  }
};
})();
</script>
</body>
</html>
